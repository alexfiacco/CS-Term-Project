const I = (id, c) => `<svg${c ? ` class="${c}"` : ''}><use href="#${id}"/></svg>`;
const im = (f) => 'b34-next-v1-img/' + f;
const chrome = () => `<div class="island"></div><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" style="width:18px;height:12px"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><span class="bat"></span></span></div><div class="homeb"></div>`;
// The Picks screen as built (picks-backdrop-v3 C1, Short Term 12). `shift` moves the still down under a pinned card.
function picks(shift = 0, extra = '') {
  const t = 154 + shift;
  return `<img class="amb" src="${im('bd-st12.jpg')}" style="top:${t}px">`
    + `<img class="art" src="${im('bd-st12.jpg')}" style="top:${t}px">`
    + `<div class="hdr"></div>`
    + `<div class="topbar"><img src="${im('fan.svg')}" alt=""><span class="wm">Montage</span><span class="ib">${I('bell')}</span><span class="circ">${I('menu')}</span></div>`
    + `<div class="tags"><span class="on">For you</span><span>Winter</span><span>New releases</span><span>Friends</span></div>`
    + extra
    + `<div class="blk"><div class="prow"><img class="inset" src="${im('po-st12.jpg')}"><div class="trl">${I('play')}Trailer</div></div>`
    + `<div class="head"><h2>Short Term 12</h2><div class="ms"><div class="n">80<small>%</small></div><span class="l">MATCH</span></div>`
    + `<div class="m">2013 · 1h 36m · Destin Daniel Cretton</div>`
    + `<div class="w">Because you loved <a>12 Years a Slave</a></div></div></div>`
    + `<div class="stub"><div class="p">${I('eye')}Seen it</div><div class="pf"></div><div class="p">${I('bm')}Watchlist</div><div class="pf"></div><div class="p">${I('x')}Not for me</div></div>`
    + `<div class="tbar"><div class="on">${I('clap')}Picks</div><div>${I('search')}Browse</div><div><span class="pill">${I('popcorn')}</span></div><div>${I('users')}Social</div><div>${I('drama')}Profile</div></div>`;
}
const phone = (inner, id) => `<div class="ph" id="${id}">${inner}${chrome()}</div>`;
const drawer = (top, body) => picks() + `<div class="dim"></div><div class="dr" style="top:${top}px"><div class="grab"></div>${body}</div>`;
const col = (cap, sub, ph) => `<div class="col"><div class="cap">${cap}</div><div class="capsub">${sub}</div>${ph}</div>`;
const chip = (t, on, x) => `<span class="ch${on ? ' on' : ''}">${on && !x ? I('check') : ''}${t}${x ? I('x') : ''}</span>`;

// A1: Show less of with "Learned this week" on top.
const lr = (t, s) => `<div class="lr"><div class="t"><b>${t}</b><span>${s}</span></div><span class="x">${I('x')}</span></div>`;
const a1 = drawer(64, `<div class="dh"><div><h3>Show less of</h3><div class="sub">Settings</div><div class="bar2"></div></div><span class="xc">${I('x')}</span></div>`
  + `<p class="lead">Lower in your picks, never hidden.</p>`
  + `<div class="eb">Learned this week</div>`
  + lr('Drama', 'From 3 skips · fades in 5 days')
  + lr('Slow-burn paranoia thrillers', 'From 2 Not for me · fades in 6 days')
  + `<div class="note">From what you swipe. Each one fades on its own.</div>`
  + `<div class="eb">Always</div>`
  + `<div class="chips">${chip('Westerns', 1)}${chip('Horror')}${chip('Musicals')}${chip('War')}${chip('Sci-fi')}${chip('Fantasy')}${chip('Superhero')}${chip('Animation')}${chip('Crime')}${chip('Family')}</div>`
  + `<div class="chips" style="margin-top:8px">${chip('Slow-burn crime', 1, 1)}${chip('Quentin Tarantino', 1, 1)}</div>`
  + `<div class="eb">Themes</div><div class="chips">${chip('Sad endings')}${chip('Slow burns')}${chip('Long (3h+)')}</div>`);

// A2: the menu sheet with the quiet "Tuned for you · 2" row.
const mi = (ic, t, v, cls) => `<div class="mi${cls ? ' ' + cls : ''}">${I(ic)}${t}${v ? `<span class="v">${v}</span>` : ''}${I('chev', 'chev')}</div>`;
const a2 = drawer(300, `<div class="dh"><div><h3>Menu</h3></div><span class="xc">${I('x')}</span></div>`
  + `<div class="pmh" style="margin-top:16px"><span class="av">E</span><div><b>Emma</b><span>@emma</span></div><span class="ed">Edit profile</span></div>`
  + `<div style="margin-top:16px">${mi('user', 'View public profile')}${mi('slid', 'Settings')}${mi('spark', 'Tuned for you', '2', 'quiet hl')}${mi('info', 'How Montage works')}${mi('msg', 'Send feedback or report a problem')}</div>`);

// B1: Tonight, six chips and Describe it.
const tnTop = `<div class="tnh"><h3>Tonight</h3><span class="xc">${I('x')}</span></div>`;
const b1 = drawer(64, tnTop
  + `<div class="fld">${I('spark')}short, funny, with my brother</div>`
  + `<div class="eb">Or tap</div>`
  + `<div class="chips">${chip('Funny')}${chip('Feel-good')}${chip('Tense')}${chip('Under 2h')}${chip('On your services')}<span class="ch"><span class="av">J</span>With Jacob</span></div>`
  + `<div class="lnk" style="justify-content:start;margin-top:8px">More filters</div>`
  + `<div style="position:absolute;left:16px;right:16px;bottom:48px"><div class="cta">Pick for me</div><div class="lnk">Surprise me</div></div>`);

// B2: parsed chips, then the four.
const bk = (f, t, m) => `<div class="bk"><img src="${im(f)}"><b>${t}</b><span>${m}</span></div>`;
const b2 = drawer(64, tnTop
  + `<div class="fld f">${I('spark')}short, funny, with my brother<span class="cl">${I('x')}</span></div>`
  + `<div class="read">We read that as</div>`
  + `<div class="chips">${chip('Under 100 min', 1, 1)}${chip('Funny', 1, 1)}<span class="ch on"><span class="av">J</span>With: @jacob${I('x')}</span></div>`
  + `<div class="hero"><img src="${im('budapest.jpg')}"><div class="hi"><h4>The Grand Budapest Hotel</h4><div class="mm">2014 · 1h 39m</div><div class="sc"><b>91<small style="font-size:12px">%</small></b>for you both</div><div class="cta">Watch this tonight</div></div></div>`
  + `<div class="backs">${bk('strangelove.jpg', 'Dr. Strangelove', '1h 35m · 88%')}${bk('ladybird.jpg', 'Lady Bird', '1h 34m · 86%')}${bk('toystory.jpg', 'Toy Story', '1h 21m · 84%')}</div>`);

// C1: the watching card pinned under the tabs.
const c1 = picks(92, `<div class="wc"><img src="${im('se7en.jpg')}"><div class="t">You're watching Se7en tonight<span>Picked at 8:10 pm</span></div><span class="ny">Not yet</span><span class="ri">Rate it</span></div>`);

// C2: Tonight reopened the same night.
const c2 = drawer(64, tnTop
  + `<div class="tk"><img src="${im('se7en.jpg')}"><div><div class="e">Tonight</div><h4>Se7en</h4><div class="mm">1995 · 2h 7m · Fincher</div><span class="st">Admit one</span><div class="when">Picked at 8:10 pm</div></div></div>`
  + `<div class="cta" style="margin-top:16px">Rate it</div>`
  + `<div class="ghost" style="margin-top:12px">Pick something else</div>`
  + `<div class="fold"><span class="ps"><img src="${im('se7en.jpg')}"><img src="${im('zodiac.jpg')}"><img src="${im('prisoners.jpg')}"><img src="${im('fightclub.jpg')}"></span><b>Tonight's 4 picks</b>${I('down')}</div>`);

// C3: lock screen.
const c3 = `<div class="lock"></div><div class="lkd">Tuesday 10 November</div><div class="lkt">10:41</div>`
  + `<div class="nt"><span class="ic"><img src="${im('fan.svg')}"></span><div class="tx"><div class="a"><span>Montage</span><span>now</span></div><b>How was Se7en?</b><span>Tap to rate it while it's fresh.</span></div><img class="th" src="${im('se7en.jpg')}"></div>`
  + `<div class="lkb" style="left:48px">${I('torch')}</div><div class="lkb" style="right:48px">${I('cam')}</div>`;

document.getElementById('s1').innerHTML =
  col('Now · Show less of', 'As built (b34h). Day signals reorder Picks for 7 days but <b>nothing lists them</b>, so they cannot be undone here.', `<img class="nowimg" src="built-b34h-showless.png">`)
  + col('A1 · Learned this week', 'A new top section: what today\'s swipes taught us, why, and when it fades, each with an <b>×</b>. The permanent chips move under <b>Always</b>.', phone(a1, 'a1'))
  + col('A2 · Menu entry', 'A quiet <b>Tuned for you · 2</b> row under Settings opens A1. Shown only while something is learned.', phone(a2, 'a2'));
document.getElementById('s2').innerHTML =
  col('B1 · Tonight, six chips', 'Only the six chips most likely tonight, plus <b>Describe it</b>. Everything else sits behind More filters.', phone(b1, 'b1'))
  + col('B2 · After typing', 'The words become <b>removable chips</b> so you can see what we understood, then the four picks.', phone(b2, 'b2'));
document.getElementById('s3').innerHTML =
  col('C1 · Back 90 min later', 'A slim card pinned above the deck. <b>Rate it</b> opens the rating sheet; <b>Not yet</b> hides it till tomorrow.', phone(c1, 'c1'))
  + col('C2 · Tonight reopened', 'The drawer opens on the ticket, not new picks. The four stay one tap away.', phone(c2, 'c2'))
  + col('C3 · Push, 2.5h after', 'iPhone only. One push the same night; the morning email then skips this pick.', phone(c3, 'c3'));
Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body></html>
