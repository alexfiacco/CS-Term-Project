<!doctype html><html><head><meta charset="utf-8">
<title>Pitch follow-ups</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#141417;--panel-2:#18181b;--line:#2a2a2e;--line-2:#3a3a3e;--ink:#efe8da;--muted:#a9a69e;--faint:#8a877f;--accent:#5b8fc4;--accent-2:#8fb3d9;--accent-soft:rgba(91,143,196,.14);--red:#c8233a}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;gap:24px;padding:24px;width:1275px;align-items:flex-start}
.col{width:393px}
.cap{font-size:12px;letter-spacing:.08em;color:var(--faint);margin:0 0 8px 4px;text-transform:uppercase;font-weight:500}
.cap b{color:var(--ink);font-weight:500}
.ph{width:393px;height:852px;background:var(--bg);border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.sb{height:48px;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0;font:600 16px Inter}
.sb i{font-style:normal;letter-spacing:2px;font-size:12px}
.hd{display:flex;align-items:center;gap:12px;padding:4px 16px 0}
.bk{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.ey{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase;flex:1}
.lk{font-size:14px;color:var(--accent-2);font-weight:500;height:44px;display:flex;align-items:center}
.bd{padding:12px 16px 0}
.sent{font:400 26px/1.2 'Bodoni Moda',serif;margin:0 0 4px}
.bar{display:flex;margin:8px 0 12px}.bar span{width:16px;height:2px;border-radius:2px}.bar .r{background:var(--red)}.bar .b{background:var(--accent)}
.scroll.end>*:first-child{margin-left:-104px}
.scroll{display:flex;gap:8px;margin:0 -16px;padding:0 16px;overflow:hidden;white-space:nowrap}
.chip{height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--panel-2)}
.chip.on .x{color:var(--faint);font-size:15px;line-height:1;margin-left:2px}
.chip.new{border-color:var(--accent);background:var(--accent-soft)}
.chip.new .x{color:var(--accent-2)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint);height:44px}
.meta a{color:var(--accent-2);font-weight:500;text-decoration:none;height:44px;display:flex;align-items:center;padding-left:12px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.po{width:48px;height:72px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 0 1px var(--line-2);display:flex;align-items:flex-end;padding:4px;font:500 20px/1 'Bodoni Moda',serif;color:rgba(239,232,218,.55);overflow:hidden}
.row .t{font-size:15px;font-weight:600}
.row .y{font-size:12px;color:var(--muted);margin-top:4px}
.row .w{font:400 14px/1.3 Newsreader,serif;color:var(--muted);margin-top:4px}
.row .m{margin-left:auto;font-size:14px;color:var(--accent-2);font-weight:600;padding-left:8px}
.lbl{font-size:12px;color:var(--faint);margin:16px 0 8px}
.thin{display:flex;align-items:center;justify-content:space-between;height:44px;border-bottom:1px solid var(--line);font:400 16px Newsreader,serif;color:var(--ink);margin-top:4px}
.thin span b{font-weight:500;color:var(--accent-2)}
.thin svg{flex:0 0 auto}
.box{position:absolute;left:16px;right:16px;bottom:24px}
.in{height:52px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);display:flex;align-items:center;padding:0 4px 0 20px;font:400 16px Newsreader,serif;color:var(--faint)}
.in span{flex:1}
.in .typed{color:var(--ink)}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.mic{width:44px;height:44px;border-radius:50%;background:#0b0b0d;display:flex;align-items:center;justify-content:center}
.fu{position:absolute;left:0;right:0;bottom:96px;padding:0 16px}
</style></head><body>
<script>
// Placeholder posters (TMDB not reachable from this mock's machine): flat tones, title set small.
const POS={
 jr:['#3a2a1c','#6b4a2a','Jathi Ratnalu'],ee:['#1c2630','#3d5568','Eega'],mr:['#2c2218','#5e4630','Maryada Ramanna'],
 av:['#2a1c22','#5a3444','Ala Vaikunthapurramuloo'],f2:['#1f2a22','#3f5a46','F2'],as:['#2a2618','#5c5230','Ante Sundaraniki'],bh:['#1c2030','#384266','Bheeshma']};
const po=k=>{const[a,b,t]=POS[k];return `<div class="po" style="background:linear-gradient(160deg,${b},${a})">${t[0]}</div>`};
const chev=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#efe8da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
const micI=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#efe8da" stroke-width="1.75" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const up=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0d" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
const arr=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
const hdr=`<div class="sb"><span>9:41</span><i>●●● ▮</i></div><div class="hd"><div class="bk">${chev}</div><span class="ey">Your pitch</span><span class="lk">New pitch</span></div>`;
const chip=(t,c)=>`<span class="chip ${c||'on'}">${t}<span class="x">×</span></span>`;
const head=(chips,meta,end)=>`<p class="sent">“funny Telugu movies”</p><div class="bar"><span class="r"></span><span class="b"></span></div>
<div class="scroll${end?' end':''}">${chips}</div><div class="meta">${meta}</div>`;
const row=(k,t,y,w,m)=>`<div class="row">${po(k)}<div><div class="t">${t}</div><div class="y">${y}</div><div class="w">${w}</div></div><div class="m">${m}</div></div>`;
const fus=list=>`<div class="fu"><div class="scroll">${list.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>`;
const box=(typed)=>`<div class="box"><div class="in">${typed?`<span class="typed">${typed}</span><div class="send">${up}</div>`:`<span>Ask a follow-up</span><div class="mic">${micI}</div>`}</div></div>`;

const f1=hdr+`<div class="bd">${head(chip('Comedy')+chip('Telugu'),'<span>Sorted for you · 24 films</span>')}
${row('jr','Jathi Ratnalu','2021 · 2h 28m','Three friends, one courtroom farce','94%')}
${row('ee','Eega','2012 · 2h 14m','Revenge, as a housefly','91%')}
${row('mr','Maryada Ramanna','2010 · 2h 5m','A guest who must never leave the house','89%')}
${row('av','Ala Vaikunthapurramuloo','2020 · 2h 45m','A swapped-at-birth family comedy','87%')}
</div>`+fus(['Shorter','Something lighter','Older','Newer','More like #1'])+box();

const f2=hdr+`<div class="bd">${head(chip('Comedy')+chip('Telugu')+chip('After 2015','new'),'<span>After 2015 added · 11 films</span><a>Undo</a>')}
${row('jr','Jathi Ratnalu','2021 · 2h 28m','Three friends, one courtroom farce','94%')}
${row('av','Ala Vaikunthapurramuloo','2020 · 2h 45m','A swapped-at-birth family comedy','87%')}
${row('f2','F2: Fun and Frustration','2019 · 2h 28m','Two husbands, one long holiday','85%')}
${row('as','Ante Sundaraniki','2022 · 2h 56m','An interfaith romance told in lies','83%')}
</div>`+fus(['Shorter','Something lighter','Older','More like #1'])+box();

const f3=hdr+`<div class="bd">${head(chip('Comedy')+chip('Telugu')+chip('After 2015')+chip('On Netflix','new'),'<span>“only on Netflix” read as On Netflix</span><a>Undo</a>',1)}
${row('av','Ala Vaikunthapurramuloo','2020 · 2h 45m','A swapped-at-birth family comedy','87%')}
${row('as','Ante Sundaraniki','2022 · 2h 56m','An interfaith romance told in lies','83%')}
<div class="thin"><span>Only 2 films fit. <b>Drop Netflix?</b></span>${arr}</div>
</div>`+fus(['Shorter','Something lighter','Older','More like #1'])+box();

const frames=[
 ['1 · <b>Free</b>, first answer',f1],
 ['2 · <b>Free</b>, tapped Newer',f2],
 ['3 · <b>Free</b>, typed a follow-up',f3]];
document.body.innerHTML=frames.map(([c,h])=>`<div class="col"><p class="cap">${c}</p><div class="ph">${h}</div></div>`).join('');
</script></body></html>
