<span class="lbl">Montage brand / V1 motion and alignment</span>
<h1>How V1 arrives, and how it sits</h1>
<p style="max-width:820px;margin-top:10px">Four ways for the edit to end on the two-frame strip without cards morphing into it, and one alignment rule for every place the strip sits beside the wordmark.</p>

const ink=bg=>bg===C?'#141210':C;
const MC=(bg,s)=>mBody(ink(bg),{baseSerif:false})+tickBar(18,s?77:76.4,64,s?6:3.2);
const W=(x0,inner)=>svg('0 0 100 100',inner);
const body=`<rect x="14" y="26" width="72" height="48" rx="5" fill="${C}"/>`;
const holesAt=(dx=0)=>{let s='';for(let k=-1;k<7;k++){const x=14+7.2*(2*k+1)-3+dx;s+=`<rect x="${x.toFixed(2)}" y="30" width="6" height="4" rx="1.2" fill="#000"/><rect x="${x.toFixed(2)}" y="66" width="6" height="4" rx="1.2" fill="#000"/>`}return s};
const clipBody=`<clipPath id="cb"><rect x="14" y="26" width="72" height="48" rx="5"/></clipPath>`;
const fr=(x,f,h=26,y=37)=>`<rect x="${x}" y="${y}" width="30.5" height="${h}" rx="1.5" fill="${f}"/>`;
const grey=['#6d675e','#5b6470','#7a7266','#625a66'];
// A1: body fixed, film runs through it (frames on a 33.5 pitch), landing red then blue
const A1=d=>{let s='';const seq=[grey[0],grey[1],grey[2],grey[3],R,B];seq.forEach((c,i)=>{s+=fr(18+33.5*(i-4)+d,c)});return body+`<g clip-path="url(#cb)">${holesAt(d%14.4)}${s}</g>`};
// A2: empty strip, lamp fills red then blue (fill rises from the bottom of each frame)
const A2=(r,b)=>body+holesAt()+fr(18,'#1a1a1d')+fr(51.5,'#1a1a1d')+(r?fr(18,R,26*r,37+26*(1-r)):'')+(b?fr(51.5,B,26*b,37+26*(1-b)):'');
// A3: the tick draws, thickens to frames, strip grows round it
const A3=[()=>`<rect x="18" y="47" width="${32*0.6}" height="6" fill="${R}"/>`,
 ()=>`<rect x="18" y="47" width="32" height="6" fill="${R}"/><rect x="50" y="47" width="32" height="6" fill="${B}"/>`,
 ()=>`<rect x="18" y="37" width="30.5" height="26" rx="1.5" fill="${R}"/><rect x="51.5" y="37" width="30.5" height="26" rx="1.5" fill="${B}"/>`,
 ()=>`<rect x="14" y="33" width="72" height="34" rx="5" fill="${C}"/>`+fr(18,R)+fr(51.5,B),
 ()=>v1('#000')];
const fanP=(spread)=>[[-1,'#3a2b2b'],[1,'#2c3b45'],[0,'#4a4436']].map(([s,c])=>`<g transform="rotate(${s*spread} 50 96)"><rect x="32" y="26" width="36" height="52" rx="4" fill="${c}" stroke="#000" stroke-width="2.5" paint-order="stroke"/><rect x="36" y="64" width="20" height="2" fill="#efe7d6" opacity=".6"/></g>`).join('');
const boards={
 A1:{name:'Film runs',pick:true,frames:[[A1(134),'Film is already running through the strip, right to left'],[A1(100),'Frames run through, one pull at a time (the LoadingStrip claw)'],[A1(62),'The last grey frames pass'],[A1(28),'Red pulls into the gate'],[v1('#000'),'Red and blue stop in place: V1']]},
 A2:{name:'Frames fill',frames:[[A2(0,0),'The empty strip, gate dark'],[A2(.5,0),'The lamp comes up on the red frame'],[A2(1,0),'Red full'],[A2(1,.5),'Blue follows'],[A2(1,1),'Both lit: V1']]},
 A3:{name:'Tick to film',frames:A3.map((f,i)=>[f(),['The red half of the tick draws','The tick completes, red then blue','It opens into two frames','The cream strip grows round them','Sprockets punch: V1'][i]])},
 A4:{name:'Posters, then a cut',frames:[[fanP(0),'The edit’s three posters, stacked'],[fanP(10),'They fan'],[fanP(16),'Full fan, held on the beat'],['', 'Hard cut to black (two frames)'],[v1('#000'),'Cut in: V1']]}};
let h='';
for(const [k,b] of Object.entries(boards)){
 h+=`<section data-shot="${k.toLowerCase()}"><span class="lbl">${k}</span><h2>${b.name}</h2><div class="strip4" style="grid-template-columns:repeat(5,1fr)">${b.frames.map(([s,c],i)=>`<figure>${svg('0 0 100 100',clipBody+s)}<figcaption><b style="color:#8a877f">${i+1}</b> ${c}</figcaption></figure>`).join('')}</div></section>`}
// ---- alignment spec ----
const H=120,cap=0.7407*H,mh=1.1*cap,mtop=0.3704*H-mh/2,gap=0.5*cap,mw=mh*1.5;
const guide=(y,lab,col='#5b8fc4')=>`<div style="position:absolute;left:-20px;right:-150px;top:${y}px;border-top:1px dashed ${col}"></div><span style="position:absolute;right:-150px;top:${y-16}px;font:500 11px Inter;color:${col}">${lab}</span>`;
h+=`<section data-shot="spec"><span class="lbl">Alignment</span><h2>Centre the strip on the letters, not the line box</h2>
<p style="margin-top:6px;max-width:820px">The wordmark artwork is 1890 units tall: cap height 1400, descender 490 (the g). Centring on the box puts the strip 13% of the wordmark’s height too low. The rule, in units of the cap height (cap):</p>
<ul style="margin:12px 0 0 18px;font:14px/1.8 Inter;color:#c9c3b6"><li>Strip height = 1.1 × cap (width 1.65 × cap, 3:2).</li><li>Strip centre = optical centre of the word: halfway between cap line and baseline, which is 0.370 × the wordmark artwork height from its top.</li><li>Gap between strip and M = 0.5 × cap.</li><li>Strip overshoots the cap line and baseline by 0.05 × cap each, because the solid block looks smaller than letters of the same height.</li></ul>
<div style="position:relative;margin:40px 0 30px 40px;height:${H}px;width:${mw+gap+H*8381/1890}px">
 ${guide(0,'cap line')}${guide(cap,'baseline')}${guide(cap/2,'optical centre','#c24c56')}${guide(H,'artwork bottom (descender)','#5a5852')}
 <span style="position:absolute;left:0;top:0;display:inline-flex;align-items:flex-start"><span style="display:block;margin-top:${mtop}px;margin-right:${gap}px">${v1Glyph(mh)}</span>${wordmark(H)}</span>
 <div style="position:absolute;left:${mw}px;width:${gap}px;top:${cap+18}px;border-top:1px solid #efe7d6"></div><span style="position:absolute;left:${mw-6}px;top:${cap+24}px;font:500 11px Inter;color:#efe7d6">gap 0.5 cap</span>
</div>
<div class="cap" style="margin-top:40px">Exact numbers per place</div>
<table style="border-collapse:collapse;font:13px Inter;color:#c9c3b6;margin-top:6px">${[['Place','Wordmark height','Cap','Strip (h × w)','Strip top offset','Gap'],...[['Top bar',18],['Share card',13],['Email header',22],['Landing',27]].map(([n,w])=>{const c=.7407*w;return [n,w,c.toFixed(1),`${(1.1*c).toFixed(1)} × ${(1.65*c).toFixed(1)}`,(0.3704*w-0.55*c).toFixed(2),(0.5*c).toFixed(1)]})].map((r,i)=>`<tr>${r.map(c=>`<td style="padding:7px 18px 7px 0;border-bottom:1px solid #2a2a2e;${i?'':'color:#8a877f;font-weight:600'}">${c}</td>`).join('')}</tr>`).join('')}</table>
<p style="margin-top:8px;font-size:14px">All values in CSS px. Offset is from the top of the wordmark artwork (negative = above it).</p></section>`;
const ctx=(lab,bg,inner,pad='18px 20px')=>`<div><div class="cap" style="font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8a877f;margin-bottom:8px">${lab}</div><div style="background:${bg};border:1px solid #2a2a2e;border-radius:14px;padding:${pad};position:relative">${inner}</div></div>`;
const ruled=(w)=>{const c=.7407*w;return `<span style="position:relative;display:inline-block">${lockup(w)}<span style="position:absolute;left:-8px;right:-8px;top:${(0.3704*w).toFixed(2)}px;border-top:1px dashed rgba(194,76,86,.8)"></span></span>`};
h+=`<section data-shot="places"><span class="lbl">In place</span><h2>Four places, one rule (red dash = optical centre)</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px">
 ${ctx('Top bar · wordmark 18','#0b0b0d',`<div style="display:flex;justify-content:space-between;align-items:center">${ruled(18)}<span style="width:30px;height:30px;border-radius:50%;background:#2a2a2e"></span></div>`)}
 ${ctx('Share card · wordmark 13','#141417',`<div style="display:flex;justify-content:flex-end">${ruled(13)}</div>`)}
 ${ctx('Email header · wordmark 22','#0b0b0d',`<div style="display:flex;justify-content:center;padding:14px 0">${ruled(22)}</div>`)}
 ${ctx('Landing · wordmark 27','#0b0b0d',`<div style="display:flex;justify-content:center;padding:22px 0">${ruled(27)}</div>`)}
</div></section>`;
h+=`<section data-shot="pick"><span class="lbl">Pick</span><h2>A1, film runs</h2><p style="margin-top:8px;max-width:860px">A1 is the only option that is already Montage’s own motion: it is the LoadingStrip claw that ships today, so the edit’s ending, the loader and the logo become one behaviour. It never morphs anything; the strip is simply there and film runs through it until our two frames land in the gate. A3 is a strong second and the most “brand” (the tick literally becomes film), but it is a construction animation and reads as a logo reveal. A2 is pleasant but slow and low-contrast in its first frames. A4 works as a cut, but it keeps the old fan alive in every edit, which the strip was chosen to retire; keep it only for a transition period.</p></section>`;
// ---- system panel ----
const mono=(h,bg='#0b0b0d')=>{ // alternate beside text: M cap (52 of its 100 grid) = 1.0 x word cap; tick sits below baseline. Centred on the word's optical centre by the M's own cap (24..76).
 const cap=0.7407*h,s=cap/52,boxH=100*s,topOff=0.3704*h-50*s;return `<span style="display:inline-flex;align-items:flex-start;height:${h}px"><span style="display:block;margin-top:${topOff.toFixed(2)}px;margin-right:${(0.5*cap - 18*s).toFixed(2)}px;margin-left:${(-18*s).toFixed(2)}px">${svg('0 0 100 100',MC(bg,false),`width="${boxH.toFixed(2)}" height="${boxH.toFixed(2)}"`)}</span>${wordmark(h)}</span>`};
const role=(lab,art,uses)=>`<div style="border:1px solid #2a2a2e;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px"><div style="font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8a877f">${lab}</div><div style="min-height:120px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">${art}</div><p style="font-size:14px">${uses}</p></div>`;
h+=`<section data-shot="system"><span class="lbl">System</span><h2>Primary, alternate, text logo</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px">
 ${role('Primary · V1 strip',`${svg('0 0 100 100',`<rect width="100" height="100" fill="#0b0b0d"/>`+v1('#0b0b0d'),'width="88" height="88" style="border-radius:19.7px;box-shadow:0 0 0 1px #2a2a2e"')}${lockup(18)}`,'App icon, top bar with the wordmark, the loader (film runs, A1), the streak chip.')}
 ${role('Alternate · drawn M on the tick',`${svg('0 0 100 100',`<rect width="100" height="100" fill="#0b0b0d"/>`+MC('#0b0b0d',false),'width="88" height="88" style="border-radius:50%;box-shadow:0 0 0 1px #2a2a2e"')}${svg('0 0 100 100',`<rect width="100" height="100" fill="#efe7d6"/>`+MC('#efe7d6',false),'width="56" height="56" style="border-radius:50%"')}`,'Social avatar, email and press monogram, small brand moments (stickers, end cards, the share-card corner when space is square).')}
 ${role('Text logo · wordmark',`${wordmark(30)}`,'“Montage” in the outlined Bodoni wordmark, alone wherever the strip or the M is already on screen.')}
</div>
<div style="font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8a877f;margin:28px 0 10px">Alignment: the alternate follows the same rule</div>
<p style="max-width:860px;font-size:15px">Beside text, the drawn M is set at the word’s cap height (M cap = 1.0 × wordmark cap) and its cap/baseline midpoint sits on the word’s optical centre; the tick hangs below the baseline like a descender, and the M’s stem, not its serif, sits 0.5 × cap from the word. Red dash = optical centre.</p>
<div style="display:flex;gap:40px;align-items:center;margin-top:16px;background:#0b0b0d;border:1px solid #2a2a2e;border-radius:14px;padding:24px 28px">${[22,40].map(w=>`<span style="position:relative;display:inline-block">${mono(w)}<span style="position:absolute;left:-8px;right:-8px;top:${(0.3704*w).toFixed(2)}px;border-top:1px dashed rgba(194,76,86,.85)"></span></span>`).join('')}<span style="position:relative;display:inline-block">${lockup(40)}<span style="position:absolute;left:-8px;right:-8px;top:${(0.3704*40).toFixed(2)}px;border-top:1px dashed rgba(194,76,86,.85)"></span></span></div></section>`;
document.getElementById('s').innerHTML=h;
</script></body></html>
