<!doctype html><html><head><meta charset="utf-8"><title>Reveal animation</title>
<meta name="viewport" content="width=393">
<style>
@font-face{font-family:Bod;src:url(file:///home/user/montage/assets/fonts/BodoniModa-SemiBold.ttf)}
@font-face{font-family:Inter;src:url(file:///home/user/montage/assets/fonts/Inter-SemiBold.woff);font-weight:600}
@font-face{font-family:News;src:url(file:///home/user/montage/assets/fonts/Newsreader-Regular.woff)}
@font-face{font-family:News;src:url(file:///home/user/montage/assets/fonts/Newsreader-Italic.woff);font-style:italic}
:root{--bg:#0B0B0D;--ink:#EFE8DA;--muted:#A9A69E;--faint:#8A877F;--acc2:#8FB3D9;--sel:#5A86BD;--tick:#C24C56;--line:#2A2A2E;--line2:#3A3A3E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:393px;height:852px;overflow:hidden;background:var(--bg);color:var(--ink);font:600 15px Inter,sans-serif}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 40px;font:600 16px Inter;z-index:9}
.sb i{font-style:normal;letter-spacing:1px;font-size:13px}
.home{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:9}

/* beat 1 */
#b1{position:absolute;inset:0}
.st{position:absolute;left:50%;top:190px;width:200px;height:300px;margin-left:-100px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
@keyframes slide{0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr))}100%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.st{animation:slide .6s cubic-bezier(.2,.8,.2,1)}
.read{position:absolute;left:0;right:0;top:560px;text-align:center;font:20px/1.4 News;animation:fadeup .5s ease-out .4s}
.dots{position:absolute;left:0;right:0;top:604px;display:flex;justify-content:center;gap:6px;animation:fadeup .5s ease-out .5s}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:blink 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fadeup{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes out1{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(.92)}}
#b1{animation:out1 .45s ease-in 2.5s}
/* beat 2 */
.you{position:absolute;left:0;right:0;top:362px;text-align:center;font:600 11px Inter;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);animation:youk 2.3s linear 3.0s}
@keyframes youk{0%{opacity:0}17%{opacity:1}87%{opacity:1}100%{opacity:0}}
.name{position:absolute;left:0;right:0;top:390px;text-align:center;font:500 64px/1 Bod;animation:develop 1.1s cubic-bezier(.2,.7,.2,1) 3.0s,pulse .35s ease-out 4.1s,rise .7s cubic-bezier(.5,0,.2,1) 5.0s}
@keyframes develop{0%{opacity:0;filter:blur(22px);letter-spacing:6px}60%{opacity:.8}100%{opacity:1;filter:blur(0);letter-spacing:0}}
@keyframes pulse{0%{scale:1}40%{scale:1.045}100%{scale:1}}
@keyframes rise{0%{transform:none}100%{transform:translateY(-290px) scale(.53)}}
.ring{position:absolute;left:50%;top:422px;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:1.5px solid var(--ink);opacity:0;animation:ripple .7s ease-out 4.1s}
@keyframes ripple{0%{opacity:0;transform:scale(.4)}8%{opacity:.45;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
.tick{position:absolute;left:50%;top:478px;width:40px;margin-left:-20px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--tick) 50%,var(--sel) 50%);animation:grow .4s ease-out 4.15s,tickmove .7s cubic-bezier(.5,0,.2,1) 5.0s}
@keyframes grow{0%{scale:0 1}100%{scale:1 1}}
@keyframes tickmove{0%{transform:none}100%{transform:translateY(-238px) scaleX(.8)}}
.tag{position:absolute;left:0;right:0;top:496px;text-align:center;font:22px/1.3 News;color:var(--muted);animation:fadeup .5s ease-out 4.35s,tagmove .7s cubic-bezier(.5,0,.2,1) 5.0s}
@keyframes tagmove{0%{transform:none;font-size:22px}100%{transform:translateY(-332px);font-size:17px}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes fadeout{0%{opacity:1}100%{opacity:0}}
/* beat 3 */
.byl{position:absolute;left:0;right:0;top:282px;text-align:center;font:italic 20px News;color:var(--muted);animation:fadeup .5s ease-out 5.6s}
.proof{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;gap:12px}
.pf{width:100px;text-align:center;animation:fadeup .55s ease-out}
.pf .p{width:100px;height:150px;border-radius:6px;background-size:cover;background-position:center}
.pf b{display:block;font:600 13px/1.25 Inter;margin-top:8px}
.pf s{display:block;text-decoration:none;font:600 12px Inter;color:var(--acc2);letter-spacing:1px;margin-top:2px}
.why{position:absolute;left:24px;right:24px;top:560px;text-align:center;font:16px/1.45 News;animation:fadeup .5s ease-out 6.5s}
.ask{position:absolute;left:16px;right:16px;top:660px;text-align:center;animation:fadeup .5s ease-out 6.9s}
.ask h3{font:500 22px Bod}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:999px;background:var(--ink);color:#141210;display:flex;align-items:center;justify-content:center;font:600 15px Inter}
.btn2{flex:1;height:48px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font:600 15px Inter}
body .a{animation-fill-mode:both!important}
body:not(.go) .a{animation-play-state:paused!important}
</style></head><body>
<div class="sb"><span>9:41</span><i>●●● ▮</i></div>
<div id="b1" class="a">
 <div id="stack"></div>
 <div class="read a">Reading your 18 films.</div>
 <div class="dots a"><i class="a"></i><i class="a"></i><i class="a"></i></div>
</div>
<div class="ring a"></div>
<div class="you a">You're</div>
<div class="name a">Hardboiled</div>
<div class="tick a"></div>
<div class="tag a">with a Nihilist streak</div>
<div class="byl a">Because you loved</div>
<div class="proof" id="proof"></div>
<div class="why a">Slow investigations that end without comfort. You rate them a full star above everything else.</div>
<div class="ask a"><h3>Does this feel right?</h3><div class="row"><div class="btn">Spot on</div><div class="btn2">Not quite</div></div></div>
<div class="home"></div>
<script>
const I=n=>`b38-onboarding-fable-img/${n}.jpg`;
const st=[['memories',-14,-38,14,'-260px','120px','-30deg'],['prisoners',9,34,8,'260px','140px','25deg'],['andhadhun',-6,-16,4,'-240px','-200px','-20deg'],['se7en',5,18,2,'240px','-180px','20deg'],['zodiac',-1,0,0,'0px','420px','0deg']];
document.getElementById('stack').innerHTML=st.map(([n,r,x,y,fx,fy,fr],i)=>`<div class="st a" style="background-image:url(${I(n)});--r:${r}deg;--x:${x}px;--y:${y}px;--fx:${fx};--fy:${fy};--fr:${fr};animation-delay:${.15+i*.32}s;${i<4?'filter:brightness(.7)':''}"></div>`).join('');
document.getElementById('proof').innerHTML=[['zodiac','Zodiac'],['andhadhun','Andhadhun'],['memories','Memories of Murder']].map(([n,t],i)=>`<div class="pf a" style="animation-delay:${5.8+i*.18}s"><div class="p" style="background-image:url(${I(n)})"></div><b>${t}</b><s>★★★★★</s></div>`).join('');
// fixed duration for capture
window.DURATION=8000;
document.fonts.ready.then(()=>{document.title='ready'});
// open in a browser with ?play to autoplay
if(location.search.includes('play'))window.addEventListener('load',()=>setTimeout(()=>document.body.classList.add('go'),300));
</script>
</body></html>
