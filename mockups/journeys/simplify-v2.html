<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplify v2</title>
<link rel="stylesheet" href="brand-v2-base.css">
<style>
/* simplify v2 (owner, 2026-11-09): fewer words on first screens, bigger images, depth one tap away.

@font-face { font-family: "Bodoni Moda"; src: url("file:///home/user/montage/assets/fonts/BodoniModa-SemiBold.ttf"); font-weight: 400 700; }

@font-face { font-family: "Newsreader"; src: url("file:///home/user/montage/assets/fonts/Newsreader-Italic.woff"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Inter"; src: url("visual-pass-v1-img/fonts/inter-latin-400-normal.woff2"); font-weight: 400; }

* { box-sizing: border-box; margin: 0; padding: 0; }

/* profile */
.pbd { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: center / cover no-repeat; }

      <div class="stats">${cells.map(([n, l], i) => `<div class="c"${mode === 'A' && i === 0 ? ' style="position:relative"' : ''}>${mode === 'A' && i === 0 && self ? '<span class="ann" style="left:-6px;top:-6px;right:4px;bottom:-6px"></span>' : ''}<b class="${n.includes('blue-n') ? 'blue' : ''}">${n.replace('<span class="blue-n">', '').replace('</span>', '')}</b><span>${l}</span></div>`).join('')}</div>`;
  }
  const btns = self ? `<div class="pill out">Edit profile</div><div class="pill out">Share profile</div>` : `<div class="pill cream">Follow</div><div class="pill out">${ic('share', 16)}Share</div>`;
  const quiet = mode === 'B' ? `<div class="quiet hit" style="margin-top:10px;white-space:nowrap"><b>3.6★</b> avg (crowd 3.7★) · <b>2,640</b> hours, about 110 days</div>` : '';
  return `<div class="phone">${chrome()}<div class="pbd" style="${bg(self ? IMG.pbd : IMG.pbd2)}"></div>
    ${self ? `<div class="ptop"><span>${ic('bell', 22)}</span><span>${ic('menu', 22)}</span></div>` : `<div class="pback circ">${ic('chevL', 18)}</div><div class="phandle">@emma</div><div class="ptop"><span>${ic('dots', 22)}</span></div>`}
    <div class="phead"><div class="pname"><div class="pav">${name[0]}</div><div class="nm">${name}</div></div>
      ${block}<div class="pbtns">${btns}</div>
      <div class="ptabs"><b>Taste</b><span>Films</span><span>Watchlist</span><span>Lists</span><span>History</span></div>
      <div class="arch"><div class="capl">${self ? 'Your' : "Emma's"} archetype</div><div class="n">${self ? 'Nihilist' : 'Romantic'}</div>
      <div class="r">${self ? 'Drawn to the dark and unresolved.' : 'Here for the ache and the swell.'}</div>${quiet}
      <div class="mix"><i style="flex:5;background:var(--ink)"></i><i style="flex:2.5;background:#8a877f"></i><i style="flex:2;background:#55555a"></i></div></div>
    </div>${tabbar(self ? 'Profile' : 'Social')}</div>`;
}
function numbers({ who = 'self', sharing = true }) {
  const self = who === 'self';
  const rows = [
    ['Films rated', self ? 'of 1,260 logged' : 'of 862 logged', self ? '1,078' : '790'],
    ...(sharing ? [[self ? 'Your average' : 'Her average', `the crowd's is 3.7★`, '3.6★'], ['Hours watched', 'about 110 days', '2,640']] : []),
    ['Weekly streak', self ? 'best 15 weeks' : 'best 9 weeks', self ? '12 <small>wk</small>' : '5 <small>wk</small>'],
  ];
  return `<div class="phone">${chrome()}${profile({ mode: 'A', who }).replace(/^<div class="phone">/, '<div style="position:absolute;inset:0">')}<div class="dim"></div>
    <div class="drawer" style="top:${self ? 352 : (sharing ? 452 : 548)}px">
      <div class="grab"></div>
      <div class="dhead"><div style="flex:1"><div class="t">${self ? 'Your numbers' : "Emma's numbers"}</div><div class="dash"></div></div><div class="rnd">${ic('x', 16)}</div></div>

}

/* ---------- 2. Caps diet crops ---------- */

const cropQueue = (now) => `<div class="crop" style="height:300px"><div style="position:absolute;inset:0">${chrome()}</div>

  ${now ? '<div class="capl hit" style="display:inline-block;margin-top:24px">Elsewhere</div>' : '<div style="height:24px"></div>'}
  <div class="apps" style="margin-top:${now ? 12 : 8}px"><div><i>${ic('msg', 22)}</i>Messages</div><div><i>${ic('camera', 22)}</i>Instagram</div><div><i>${ic('link', 22)}</i>Copy link</div><div><i>${ic('dots', 22)}</i>More</div></div></div>`;
const cropWeek = (now) => `<div class="crop" style="height:250px;padding:8px 16px">
  <div class="fold2"><div style="flex:1"><div class="t">This week</div><div class="s">6 films logged</div></div>${ic('chevU', 18)}</div>
  ${now ? '<div class="capl blue hit" style="display:inline-block;margin-top:8px">This week</div>' : ''}

  <p class="read" style="color:var(--ink);margin-top:4px">Emma's on a Mann run. Sam finally watched Zodiac.</p></div>`;
const pairBlock = (title, verdict, fn, w) => `<div class="col" style="width:${w || 796}px"><div class="fcap" style="width:auto;min-height:72px"><b>${title} <span class="tag2 ${verdict[0]}" style="margin-left:6px">${verdict[1]}</span></b><span>${verdict[2]}</span></div><div class="pair">${fn(true)}${fn(false)}</div></div>`;

/* ---------- Table ---------- */
const T = [

  <div class="row">
    <div class="col">${cap('Now', 'Current main (ad043a05)', 'FilmScreen head(_:): title, caps meta, Directed by, synopsis (rule 1406), row of four, Your match box, stars, Letterboxd line, lanes. Lanes cut by the fold.')}${filmNow}</div>
    <div class="col">${cap('Proposed', 'The % stamped on the poster', 'Poster 108 to 124 with the 81% stamp. Meta: "2019 · 2h 13m · R · 4.5★ crowd" (genre and "Popular" go; lanes say the kind better). The box and the Letterboxd line go. Everything ends above the fold.', 1)}${filmNew}</div>

  <div class="row">${pairBlock('Tonight pick drawer', ['drop', 'Drop 2', 'Posters with % stamps under the pick are clearly the alternatives; the logos say where to watch.'], cropTonight)}${pairBlock('List page head', ['drop', 'Drop', '"44 films · 12 saves" joins the owner line.'], cropList)}</div>
  <div class="row">${pairBlock('Film page queue pill', ['short', 'Shorten', 'You know where you came from; the count says you can swipe.'], cropQueue)}${pairBlock('Share sheet', ['drop', 'Drop', 'App icons separate themselves from faces.'], cropShare)}</div>
  <div class="row">${pairBlock('Group: This week, opened', ['drop', 'Drop', 'The caps repeated the row title right above it.'], cropWeek)}</div>
</section>

<section class="sheet" data-shot="2-table">

</section>

  <div class="row">

    <div class="col">${cap('Proposed · A', 'Five cells, no chips, no stub', 'Films · streak · this year · followers · following. Same Newsreader figures. 40pt higher, so the archetype name is on the first screen.', 1)}${profile({ mode: 'A' })}</div>
    <div class="col">${cap('A · tap Films', 'Your numbers', 'Fit-height drawer: rated of logged, your average vs the crowd, hours (about N days), streak with your best, the 2026 goal bar (tap opens the goal sheet as today).', 1)}${numbers({ who: 'self' })}</div>
  </div>
</section>

<section class="sheet" data-shot="3-profile-b">

  <div class="row">
    <div class="col">${cap('Proposed · A, visitor', "Emma's profile", 'Films · streak · Blend · followers · following. Her goal shows only if she chose to show it (then it replaces streak).', 1)}${profile({ mode: 'A', who: 'other' })}</div>

  </div>
</section>

<section class="sheet" data-shot="5-picks">
  <h1>5 · Picks: say whose pick it is, drop the date</h1>
  <p class="sub">"This Week" is four films: your best unseen matches (70%+ on your scale, fewer rather than worse), fixed Monday to Sunday, new each Monday at 00:00 UTC, topped up if you log or hide them. "Today" is one more fresh film a day, never one of the four, new at your midnight, gone once answered. Both are on For You with the dateline; the tab shows the four again.</p>
  <div class="row">

    <div class="col">${cap('Proposed', 'Your pick today · Weekly Picks', 'The dateline says whose pick it is, not the date you can see on the phone. The tab names the four.', 1)}${picks({ tab3: 'Weekly Picks', dl: '<b>Your pick today</b>', hl: true })}</div>
    <div class="col">${cap('Spec', 'Every dateline, now and proposed', 'Struck through is today\'s copy.')}${picksSpec}</div>
  </div>
</section>`;
</script>
