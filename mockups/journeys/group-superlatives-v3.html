<!doctype html><html><head><meta charset="utf-8"><title>Group superlatives v3</title>
<style>
@font-face{font-family:Bodoni;src:url(file:///home/user/montage/assets/fonts/BodoniModa-SemiBold.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(file:///home/user/montage/assets/fonts/Inter-SemiBold.woff);font-weight:600}
:root{--bg:#0b0b0d;--panel:#141417;--panel-2:#18181b;--line:#2a2a2e;--line-2:#3a3a3e;--ink:#efe8da;--muted:#a9a69e;--accent:#5b8fc4;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;width:390px;background:var(--bg);color:var(--ink);font:400 15px/20px var(--ui);padding:16px 16px 24px}
.cap{font:600 11px/16px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.capn{font:400 13px/18px var(--ui);color:var(--muted);margin:0 0 12px}
.var+.var{margin-top:32px}
h2{font:600 22px/28px Bodoni,serif;margin:0 0 12px}
h3{font:600 15px/20px var(--ui);margin:16px 0 12px}
.sups{display:flex;flex-direction:column;gap:12px}
.sup{background:var(--panel);border-radius:12px;padding:12px}
.hd{display:flex;align-items:center;gap:12px}
.ic{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--panel-2)}
.ic svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tt{flex:1 1 0;min-width:0;font:600 15px/20px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:inline-flex;align-items:center;gap:8px;font:500 13px/18px var(--ui)}
.av{width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;font:600 12px/1 var(--ui);color:#0b0b0d;box-shadow:0 0 0 2px var(--panel)}
.av+.av{margin-left:-8px}
.sub{font:400 13px/18px var(--ui);color:var(--muted);margin-top:12px}
.rc{font:400 13px/20px var(--ui);color:var(--ink);margin-top:4px}
.rc b{font-weight:600}
.rc{font-size:15px;line-height:24px;letter-spacing:-.01em;text-wrap:balance}
.rc b{font:600 19px/24px Bodoni,serif;color:var(--accent);letter-spacing:.01em}
.cmp{font:400 13px/20px var(--ui);color:var(--muted)}
.rx{display:flex;gap:8px;margin-top:12px}
.rx span{border:1px solid var(--line-2);border-radius:2px;padding:4px 8px;font-size:13px;line-height:18px;color:var(--muted)}
.rx .on{background:rgba(91,143,196,.22);border-color:rgba(91,143,196,.75);color:var(--ink)}
</style></head><body><script>
const I={target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
rain:'<path d="M7 15a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17.5 15z"/><path d="M8 18v2M12 18v3M16 18v2"/>',
twins:'<rect x="4" y="6" width="9" height="13" rx="2"/><path d="M11 5h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>',
popcorn:'<path d="M6 10 8 21h8l2-11z"/><path d="M6 10a3 3 0 0 1 3-4 3 3 0 0 1 6 0 3 3 0 0 1 3 4"/><path d="m10 10 .7 11M14 10l-.7 11"/>',
snow:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/><path d="m9.5 4.5 2.5 2 2.5-2M9.5 19.5l2.5-2 2.5 2"/>'};
const C={emma:'#d9a441',sam:'#8fb3d9',yuki:'#9cc7a1',jacob:'#c9a3d6'};
const av=n=>`<span class="av" style="background:${C[n]}">${n[0].toUpperCase()}</span>`;
// [icon,title,holders,subtitle,receipt,comparison]
const ID=[
['target','Common ground',['emma'],'Closest to everyone\'s taste','<b>13 of 17</b> times, their rating was the room\'s middle one','Matches the room 88% · Group average 81%'],
['compass','Most adventurous',['yuki'],'Widest, strangest shelf','<b>350</b> films nobody else here has seen','Next: @sam with 120'],
['rain','Ruining movie night',['jacob'],'Hardest to please','<b>9 of 17</b> times, theirs was the lowest rating in the room','Matches the room 72% · Group average 81%'],
['twins','Taste twins',['emma','sam'],'The room\'s tightest pair','<b>30</b> films you both gave 5★','Within half a star on 61 of 74']];
const WK=[
['popcorn','Life of the party',['sam'],'Never not watching','<b>6</b> films logged this week','Next: @emma with 4'],
['snow','Toughest critic',['jacob'],'Unimpressed all week','<b>2.4★</b> average this week','Everyone else: 3.6★']];
const card=([ic,t,w,sub,r,c],i)=>`<div class="sup"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24">${I[ic]}</svg></span><span class="tt">${t}</span><span class="who"><span>${w.map(av).join('')}</span>${w.map(n=>'@'+n).join(' + ')}</span></div><div class="sub">${sub}</div><div class="rc">${r}</div>${c?`<div class="cmp">${c}</div>`:''}<div class="rx"><span${i==0?' class="on"':''}>🔥${i==0?' 2':''}</span><span>❤️</span><span>😂${i==2?' 3':''}</span><span>👀</span><span>🤯</span></div></div>`;
document.body.innerHTML=`<h2>Superlatives</h2><div class="sups">${ID.map(card).join('')}</div><h3>This week's awards</h3><div class="sups">${WK.map((c,i)=>card(c,i+4)).join('')}</div>`;
</script></body></html>
