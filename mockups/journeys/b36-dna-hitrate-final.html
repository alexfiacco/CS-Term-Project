<html><head><meta charset="utf-8"><style>
@font-face{font-family:Bodoni;src:url(file:///home/user/montage/assets/fonts/BodoniModa-SemiBold.ttf)}@font-face{font-family:News;src:url(file:///home/user/montage/assets/fonts/Newsreader-Regular.woff)}@font-face{font-family:Inter;src:url(file:///home/user/montage/assets/fonts/Inter-SemiBold.woff);font-weight:600}
body{margin:0;background:#050506;font-family:Inter,sans-serif;color:#efe8da;display:flex;gap:24px;padding:24px;width:828px}
.col{width:390px}.cap{font:600 13px/18px Inter;color:#a9a69e;margin:0 0 8px;height:72px}.cap b{color:#efe8da}
.ph{width:390px;min-height:844px;background:#0b0b0d;border-radius:12px;overflow:hidden;padding:16px;box-sizing:border-box;position:relative}
h1{font:600 28px/32px Bodoni;margin:8px 0 4px}
.lab{font:600 11px/16px Inter;letter-spacing:.08em;text-transform:uppercase;color:#8a877f}
.sub{font:400 15px/22px News;color:#a9a69e;margin:0 0 8px}
.key{display:flex;gap:16px;font:600 12px/16px Inter;color:#a9a69e;margin:4px 0 0}.key i{display:inline-block;width:16px;height:0;border-top:2.5px solid #8fb3d9;vertical-align:middle;margin-right:6px}.key i.d{border-top:1.5px dashed #efe8da}
.li{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.li .t{font:600 13px/20px Inter;white-space:nowrap}.li .t span{color:#8a877f;font-weight:600}.li .t b{color:#8fb3d9}
.tb{position:relative;width:64px;height:12px;flex:none}.tb:before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;border-radius:2px;background:#2a2a2e}
.tb i{position:absolute;top:2px;width:8px;height:8px;border-radius:999px;margin-left:-4px}.tb .y{background:#8fb3d9}.tb .m{background:#0b0b0d;border:1.5px solid #efe8da;box-sizing:border-box}
.thin{color:#8a877f;font:600 11px Inter;margin-left:4px;border:1px solid #3a3a3e;border-radius:999px;padding:0 6px}
.note{margin-top:8px;font:400 12px/16px Inter;color:#8a877f}
.fy{margin-top:16px;padding:12px 16px 16px;border-radius:12px;background:rgba(143,179,217,.12);border:1px solid rgba(143,179,217,.35)}
.fy .l{font:600 11px/16px Inter;letter-spacing:.08em;text-transform:uppercase;color:#8fb3d9}.fy p{margin:4px 0 0;font:400 16px/1.5 News}
.dr{position:absolute;left:0;right:0;bottom:0;top:200px;background:#141417;border-radius:12px 12px 0 0;padding:24px 16px}.grab{width:36px;height:4px;border-radius:999px;background:#3a3a3e;margin:-12px auto 16px}
.big{font:600 56px/60px Bodoni;color:#8fb3d9;margin:4px 0 8px}
.rd{font:400 16px/24px News;margin:0 0 8px}.rd.m{color:#a9a69e}
</style></head><body>
<div class="col"><p class="cap"><b>1 · Film DNA, with other people.</b> Solid shape = how often each strand becomes one of your favorites. Dashed = the typical member. Faint ring = your usual 33%.</p><div class="ph" id="p1"></div></div>
<div class="col"><p class="cap"><b>2 · Human drama drawer.</b> Your rate, your other films, then most people, then For you.</p><div class="ph" id="p2"></div></div>
<script>
// k order: name, owner, median, nmem
const S=[["Human drama",50.0,44.7,15],["Complexity",47.2,46.5,14],["Slow burn",37.5,44.8,10],["Originality",41.9,47.0,10],["Visual style",48.9,48.1,17],["Intensity",43.6,38.5,11],["Spectacle",33.7,37.0,18],["Wonder",31.6,31.3,18],["Comedy & warmth",27.8,26.1,14]];
const N=18,LO=20,HI=55,R=108,cx=180,cy=150;
const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/9,r=R*(v-LO)/(HI-LO);return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
const poly=f=>S.map((s,i)=>pt(i,f(s)).map(x=>x.toFixed(1)).join(',')).join(' ');
let g='';[30,40,50,55].forEach(v=>g+=`<polygon points="${poly(()=>v)}" fill="none" stroke="#1f1f23"/>`);
S.forEach((s,i)=>{const[x,y]=pt(i,HI);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1f1f23"/>`;
 const[lx,ly]=pt(i,HI+6.5);const an=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
 g+=`<text x="${lx}" y="${ly-2}" text-anchor="${an}" font-family="Inter" font-weight="600" font-size="11" fill="#efe8da">${s[0].replace('&','&amp;')}</text><text x="${lx}" y="${ly+12}" text-anchor="${an}" font-family="Inter" font-weight="600" font-size="11" fill="#8fb3d9">${Math.round(s[1])}%</text>`});
g+=`<polygon points="${poly(()=>33.3)}" fill="none" stroke="#3a3a3e" stroke-width="4" opacity=".7"/>`;
const[ux,uy]=pt(6.5,33.3);g+=`<text x="${ux-4}" y="${uy+16}" text-anchor="end" font-family="Inter" font-weight="600" font-size="10" fill="#8a877f">your usual</text>`;
g+=`<polygon points="${poly(s=>s[1])}" fill="rgba(91,143,196,.24)" stroke="#8fb3d9" stroke-width="2.5" stroke-linejoin="round"/>`;
g+=`<polygon points="${poly(s=>s[2])}" fill="none" stroke="#efe8da" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>`;
S.forEach((s,i)=>{const[x,y]=pt(i,s[1]);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#8fb3d9" stroke="#0b0b0d" stroke-width="2"/>`});
const svg=`<svg viewBox="-40 8 440 290" width="358" height="236">${g}</svg>`;
const head=`<div class="lab">Film DNA</div><h1>What you look for</h1><p class="sub">How often each one becomes a favorite</p>`;
const key=`<div class="key"><span><i></i>You</span><span><i class="d"></i>Most people</span></div>`;
const bx=v=>((v-20)/(55-20)*100).toFixed(1)+'%';
const rows=[...S].sort((a,b)=>b[1]-a[1]).map(s=>`<div class="li"><div class="t">${s[0]} <b>${Math.round(s[1])}%</b> <span>· most people ${Math.round(s[2])}%</span>${s[3]<=11?'<span class="thin">thin</span>':''}</div><div class="tb"><i class="m" style="left:${bx(s[2])}"></i><i class="y" style="left:${bx(s[1])}"></i></div></div>`).join('');
document.getElementById('p1').innerHTML=head+svg+key+rows+`<div class="note">Most people = the middle of ${N} members with 30+ ratings. Thin = under 12 of them have enough films in that strand.</div>`;
document.getElementById('p2').innerHTML=head+svg+`<div class="dr"><div class="grab"></div><div class="lab">Human drama</div><div class="big">50%</div><p class="rd">You loved 50% of the human-drama films you've watched, vs 30% of your other films.</p><p class="rd m">Most people on Montage: 45%.</p><div class="note">Loved = your top third. Based on 195 human-drama films and ${S[0][3]} members.</div><div class="fy"><div class="l">For you</div><p>Human drama is where your favorites come from: it lands well above your average, and a little above most people. Tears and weight are a pull for you, not a risk.</p></div></div>`;
</script></body></html>
