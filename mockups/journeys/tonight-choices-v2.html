.prow { display: flex; align-items: flex-end; gap: 16px; }

.lead { font: 400 15px/20px var(--ui); color: var(--muted); margin: 16px 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.lr .t { flex: 1; min-width: 0; }

.ch svg { width: 14px; height: 14px; }
.hs { display: flex; gap: 8px; margin-right: -16px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent); }
.row { margin-top: 20px; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: rgba(239,232,218,.05); border: 1px solid var(--line); }
.row .t { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.row b { font: 600 16px/20px var(--ui); } .row span { font: 400 13px/16px var(--ui); color: var(--muted); }
.row svg { color: var(--muted); }
.who { display: flex; gap: 12px; }
.fc { width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 12px/16px var(--ui); }
.fc i { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font: normal 600 18px/1 var(--ui); background: #6d5a46; position: relative; }
.fc.on i { box-shadow: 0 0 0 2px var(--select); }
.fc.add i { background: none; border: 1px dashed var(--line-2); }
.fc small { font: 400 11px/12px var(--ui); color: var(--muted); }
.ft { padding: 8px 0 34px; background: #0f0f11; box-shadow: 0 -16px 16px #0f0f11; }
.opt { font: 400 13px/16px var(--ui); color: var(--muted); text-transform: none; letter-spacing: 0; }
</style>
<div class="sheet" id="s1"></div>
<script>
const I = (id, c) => `<svg${c ? ` class="${c}"` : ''}><use href="#${id}"/></svg>`;
const im = (f) => 'b34-next-v1-img/' + f;
const chrome = () => `<div class="island"></div><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" style="width:18px;height:12px"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><span class="bat"></span></span></div><div class="homeb"></div>`;
// The Picks screen as built (picks-backdrop-v3 C1, Short Term 12). `shift` moves the still down under a pinned card.
function picks(shift = 0, extra = '') {
  const t = 154 + shift;
  return `<img class="amb" src="${im('bd-st12.jpg')}" style="top:${t}px">`
    + `<img class="art" src="${im('bd-st12.jpg')}" style="top:${t}px">`
    + `<div class="hdr"></div>`
    + `<div class="topbar"><img src="${im('fan.svg')}" alt=""><span class="wm">Montage</span><span class="ib">${I('bell')}</span><span class="circ">${I('menu')}</span></div>`
    + `<div class="tags"><span class="on">For you</span><span>Winter</span><span>New releases</span><span>Friends</span></div>`
    + extra
    + `<div class="blk"><div class="prow"><img class="inset" src="${im('po-st12.jpg')}"><div class="trl">${I('play')}Trailer</div></div>`
    + `<div class="head"><h2>Short Term 12</h2><div class="ms"><div class="n">80<small>%</small></div><span class="l">MATCH</span></div>`
    + `<div class="m">2013 · 1h 36m · Destin Daniel Cretton</div>`
    + `<div class="w">Because you loved <a>12 Years a Slave</a></div></div></div>`
    + `<div class="stub"><div class="p">${I('eye')}Seen it</div><div class="pf"></div><div class="p">${I('bm')}Watchlist</div><div class="pf"></div><div class="p">${I('x')}Not for me</div></div>`
    + `<div class="tbar"><div class="on">${I('clap')}Picks</div><div>${I('search')}Browse</div><div><span class="pill">${I('popcorn')}</span></div><div>${I('users')}Social</div><div>${I('drama')}Profile</div></div>`;
}
const phone = (inner, id) => `<div class="ph" id="${id}">${inner}${chrome()}</div>`;
const drawer = (top, body, foot) => picks() + `<div class="dim"></div><div class="dr" style="top:${top}px"><div class="grab"></div>${body}${foot ? `<div class="ft">${foot}</div>` : ''}</div>`;
const col = (cap, sub, ph) => `<div class="col"><div class="cap">${cap}</div><div class="capsub">${sub}</div>${ph}</div>`;
const chip = (t, on) => `<span class="ch${on ? ' on' : ''}">${on ? I('check') : ''}${t}</span>`;
const chips = (a, sel = []) => a.map((t) => chip(t, sel.includes(t))).join('');
const ttl = (t) => `<div class="tnh"><h3>${t}</h3><span class="xc">${I('x')}</span></div>`;
const fc = (l, n, m, on, bg) => `<div class="fc${on ? ' on' : ''}"><i style="background:${bg}">${l}</i>${n}<small>${m}</small></div>`;
const f1 = drawer(64, ttl('Tonight') + `<div class="bd">`
  + `<div class="eb">Mood</div><div class="chips">${chips(['Feel-good', 'Funny', 'Light & easy', 'Romantic', 'Moving', 'Tense', 'Scary', 'Mind-bending'], ['Funny', 'Light & easy'])}</div>`
  + `<div class="eb">Genre</div><div class="hs">${chips(['Crime', 'Drama', 'Thriller', 'Comedy', 'Romance', 'Sci-fi', 'Horror', 'Action'], ['Comedy'])}</div>`
  + `<div class="row"><div class="t"><b>Anything else?</b><span>More moods, pace, length and era</span></div>${I('chev')}</div>`
  + `<div class="eb">Who's watching</div><div class="chips">${chip('Just me')}${chip('Date night')}${chip('Friends', 1)}</div>`
  + `<div class="who" style="margin-top:12px">${fc('E', 'Emma', '86%', 1, '#6d5a46')}${fc('S', 'Sam', '79%', 0, '#4f5d6e')}${fc('J', 'Jacob', '74%', 0, '#5e6b52')}<div class="fc add"><i>+</i>Add</div></div>`
  + `</div>`, `<div class="cta">Pick with these</div>`);
const f2 = drawer(64, ttl('Anything else?') + `<div class="bd">`
  + `<div class="eb">More moods</div><div class="chips">${chips(['Cozy', 'Thought-provoking', 'Weird & dreamlike', 'Visually stunning', 'Dark', 'Disturbing'])}</div>`
  + `<div class="eb">Pace and scale</div><div class="hs">${chips(['Slow burn', 'Fast-paced', 'Intimate', 'Epic'], ['Slow burn'])}</div>`
  + `<div class="eb">Length</div><div class="hs">${chips(['Any length', 'Under 90m', 'Under 2h', 'Under 2.5h'], ['Any length'])}</div>`
  + `<div class="eb">Era</div><div class="hs">${chips(['1940s', '1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'])}</div>`
  + `<div class="eb">Language <span class="opt">From your settings</span></div><div class="hs">${chips(['Any language', 'English', 'International'], ['Any language'])}</div>`
  + `<div class="eb">Age rating <span class="opt">From your settings</span></div><div class="hs">${chips(['G', 'PG', 'PG-13', 'R', 'NC-17', 'Not rated'])}</div>`
  + `</div>`, `<div class="cta">Done</div>`);
document.getElementById('s1').innerHTML =
  col('1 · Tonight choices', 'Mood and genre up front; <b>Anything else?</b> holds the rest.', phone(f1, 'f1'))
  + col('2 · Anything else? open', 'Every other filter in one sheet, then <b>Done</b>.', phone(f2, 'f2'));
document.body.dataset.ready = '1';
</script></body></html>
