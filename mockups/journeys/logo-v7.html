<title>Montage logo v7</title>

<style>
:root{--bg:#0b0b0d;--panel:#141417;--panel-2:#18181b;--line:#2a2a2e;--line-2:#3a3a3e;--ink:#efe8da;--muted:#a9a69e;--faint:#8a877f;--accent:#5b8fc4;--accent-2:#8fb3d9}
*{box-sizing:border-box;margin:0}
body{background:#0b0b0d;color:var(--ink);font-family:Inter,system-ui,sans-serif}
.page{width:1000px;padding:56px}
h1{font:600 40px 'Bodoni Moda',serif}h2{font:600 26px 'Bodoni Moda',serif;margin-top:4px}
.lbl{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
p{font-family:Newsreader,serif;font-size:16px;line-height:1.5;color:#c9c3b6}
section{background:#0b0b0d;border-top:1px solid var(--line);padding:36px 28px 40px;margin:36px -28px 0}
.pair{display:grid;grid-template-columns:390px 390px;gap:40px;margin-top:20px;justify-content:center}
.side .cap{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.side.v1 .cap{color:#efe7d6}
.scr{width:390px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:1px;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;background:#2a2a2e}
.tabs{display:flex;gap:18px;padding:12px 16px;font:500 14px Inter;color:var(--faint)}.tabs b{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:6px}
.row{display:flex;gap:10px;padding:4px 16px 18px}.row i{width:110px;height:165px;border-radius:6px;display:block}
.wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;filter:blur(2.5px);opacity:.55}
.wall i{aspect-ratio:2/3;border-radius:4px;display:block}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,30,40,.45) 0%,rgba(11,11,13,.75) 40%,#0b0b0d 85%)}
.wstreak{display:inline-flex;align-items:center;gap:10px;margin:10px 0 0;padding:8px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;font:600 14px Inter;color:var(--ink)}
.phone{background:#1d2129;padding:26px 22px;display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:16px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font:400 11px -apple-system,Inter;color:#eaeaea}
.app svg,.app i{width:60px;height:60px;border-radius:13.4px;display:block}
.verdict{border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-top:20px}

.app{display:flex;flex-direction:column;align-items:center;gap:4px;font:400 10px Inter;color:#eaeaea;width:52px}</style></head><body><div class="page" style="width:1240px"><span class="lbl">Montage brand / logo v7</span><h1>The fan as an emblem</h1>

  m:bg=>`<polygon points="31,18 52,18 43,82 20,82" fill="${R}"/><polygon points="58,18 80,18 69,82 49,82" fill="${B}"/>`},
 E3:{name:'Two cards',note:'Two cards leaning apart like the fan; where they overlap, the third colour.',
  m:bg=>{const id='e3'+(uid++);return `<clipPath id="${id}"><rect x="27" y="20" width="34" height="62" rx="5" transform="rotate(-14 50 84)"/></clipPath>`+card(44,82,-14,34,62,R).replace('x="27"','x="27"')+card(56,82,14,34,62,B)+`<g clip-path="url(#${id})">${card(56,82,14,34,62,cr(bg))}</g>`}},
 E4:{name:'Beam',note:'A projector beam from a lens: two bands of light, red over blue, opening to the right.',
  m:bg=>`<polygon points="30,47 86,18 86,47" fill="${R}"/><polygon points="30,53 86,53 86,82" fill="${B}"/><circle cx="22" cy="50" r="10" fill="${cr(bg)}"/>`},
 E5:{name:'Quarter fan',note:'Three segments of a quarter circle, red, cream and blue, like cards spread in a hand.',
  m:bg=>{const seg=(a0,a1,f)=>{const cx=20,cy=84,r=66,r0=10;const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1),[i0,j0]=pt(cx,cy,r0,a0),[i1,j1]=pt(cx,cy,r0,a1);return `<path d="M${n(i0)} ${n(j0)}L${n(x0)} ${n(y0)}A${r} ${r} 0 0 1 ${n(x1)} ${n(y1)}L${n(i1)} ${n(j1)}A${r0} ${r0} 0 0 0 ${n(i0)} ${n(j0)}Z" fill="${f}"/>`};return seg(2,28,R)+seg(32,58,cr(bg))+seg(62,88,B)}},
 E6:{name:'Solid fan',note:'My pick for the idea: today’s three-card fan with every detail removed. Three solid rounded cards, red, cream, blue, separated only by the background.',
  m:bg=>`<g stroke="${bg}" stroke-width="4" paint-order="stroke">${card(47,84,-30,30,56,R)}${card(53,84,30,30,56,B)}${card(50,84,0,30,60,cr(bg))}</g>`}};
// optical centring per mark (dx, dy, scale) in the 100 tile
const fit={E1:[0,-4,1],E2:[0,0,1],E3:[0,-1,1.02],E4:[2,0,1],E5:[10,-4,1],E6:[0,-1,1.05]};
const inner=(k,bg)=>{const [dx,dy,s]=fit[k];return `<g transform="translate(${50+dx} ${50+dy}) scale(${s*.92}) translate(-50 -50)">${E[k].m(bg)}</g>`};
const icon=(k,bg,px,ring=true)=>svg('0 0 100 100',`<rect width="100" height="100" fill="${bg}"/>${inner(k,bg)}`,`width="${px}" height="${px}" style="border-radius:${px*.2237}px;${ring?'box-shadow:0 0 0 1px '+(bg===WH?'#d8d8d8':'#2a2a2e'):''}"`);
const lock=(k,h)=>{const cap=.7407*h,mh=1.5*cap,off=.3704*h-mh/2;return `<span style="display:inline-flex;align-items:flex-start;height:${h}px"><span style="display:block;margin-top:${n(off)}px;margin-right:${n(.35*cap)}px">${svg('10 10 80 80',inner(k,BG),`width="${n(mh)}" height="${n(mh)}"`)}</span>${wordmark(h)}</span>`};
const nb=[['#34c759','<rect x="18" y="20" width="24" height="18" rx="4" fill="#fff"/><path d="M22 38l-2 6 8-6z" fill="#fff"/>','Messages'],['#ff9500','<circle cx="30" cy="30" r="12" fill="none" stroke="#fff" stroke-width="4"/>','Clock'],['#007aff','<path d="M14 40l10-16 8 10 6-6 8 12z" fill="#fff"/>','Photos'],['#ff2d55','<path d="M30 42c-10-7-14-12-14-17a7 7 0 0 1 14-2a7 7 0 0 1 14 2c0 5-4 10-14 17z" fill="#fff"/>','Health'],['#5856d6','<rect x="20" y="16" width="20" height="28" rx="3" fill="#fff"/>','Notes'],['#ffcc00','<circle cx="30" cy="30" r="9" fill="#fff"/>','Weather'],['#1c1c1e','<rect x="16" y="22" width="28" height="18" rx="3" fill="#fff"/>','Wallet']];
const nbi=([c,g,l])=>`<div class="app">${svg('0 0 60 60',`<rect width="60" height="60" fill="${c}"/>${g}`,'width="52" height="52" style="border-radius:11.6px"')}<span>${l}</span></div>`;
const home=k=>`<div style="background:#2b3a55;border-radius:16px;padding:14px 10px;display:grid;grid-template-columns:repeat(4,52px);justify-content:space-between;row-gap:10px">${[0,1,'M',2,3,4,5,6].map(o=>o==='M'?`<div class="app">${icon(k,BG,52,false)}<span>Montage</span></div>`:nbi(nb[o])).join('')}</div>`;
const ruled=(html,hh)=>`<span style="position:relative;display:inline-block">${html}<span style="position:absolute;left:-6px;right:-6px;top:${n(.3704*hh)}px;border-top:1px dashed rgba(194,76,86,.85)"></span></span>`;
const capl=t=>`<div style="font:600 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:#8a877f;margin-bottom:8px">${t}</div>`;
const KEEP=['E6','E3','E1'];
let h='';
for(const k of KEEP){const e=E[k];
 h+=`<section data-shot="${k.toLowerCase()}"><span class="lbl">${k}</span><h2>${e.name}</h2><p style="margin-top:6px;max-width:860px">${e.note}</p>
 <div style="display:grid;grid-template-columns:170px 170px 360px 1fr;gap:22px;margin-top:18px;align-items:start">
  <div>${capl('1024 · dark')}${icon(k,BG,170)}</div><div>${capl('1024 · white')}${icon(k,WH,170)}</div>
  <div>${capl('Home screen')}${home(k)}</div>
  <div>${capl('64 / 32 / 16 · dark and white')}<div style="background:#141417;border-radius:12px;padding:12px;display:flex;gap:8px;align-items:flex-end">${[64,32,16].map(p=>icon(k,BG,p)).join('')}<span style="width:6px"></span>${[64,32,16].map(p=>icon(k,WH,p)).join('')}</div>
   <div style="height:14px"></div>${capl('Top bar · wordmark 18')}<div style="background:#0b0b0d;border:1px solid #2a2a2e;border-radius:12px;padding:14px">${ruled(lock(k,18),18)}</div></div>
 </div></section>`}
document.getElementById('s').innerHTML=h;
const pos=(rot,c,ox=47)=>`<g transform="rotate(${rot} 50 84)"><rect x="35" y="24" width="30" height="${rot?56:60}" rx="5" fill="${c}" stroke="#000" stroke-width="4" paint-order="stroke"/><rect x="40" y="66" width="20" height="2.4" fill="#efe7d6" opacity=".55"/></g>`;
const fanP=()=>pos(-30,'#3a2b2b')+pos(30,'#2c3b45')+pos(0,'#4a4436');
const atile=s=>svg('0 0 100 100',`<rect width="100" height="100" fill="#000"/><g transform="translate(50 49) scale(.92) translate(-50 -50)">${s}</g>`,'style="width:100%;aspect-ratio:1;border-radius:10px;display:block"');
const anim=(k,frames)=>`<div style="margin-top:14px"><div style="font:600 11px Inter;letter-spacing:.12em;color:#efe7d6;margin-bottom:8px">${k} · ${E[k].name.toUpperCase()}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${frames.map(([s,c],i)=>`<figure>${atile(s)}<figcaption style="font:12px Inter;color:#a9a397;margin-top:6px"><b style="color:#8a877f">${i+1}</b> ${c}</figcaption></figure>`).join('')}</div></div>`;
const e3mid=`<g transform="rotate(-10 50 84)"><rect x="27" y="22" width="34" height="62" rx="5" fill="${R}"/></g><g transform="rotate(10 50 84)"><rect x="39" y="22" width="34" height="62" rx="5" fill="${B}"/></g>`;
document.getElementById('t').innerHTML=`<section data-shot="cut"><span class="lbl">Cut</span><h2>What was cut, and why</h2><ul style="margin:12px 0 0 18px;font:14px/1.8 Inter;color:#c9c3b6">
<li><b style="color:#efe7d6">E2 split card:</b> two leaning bars read as a pause button or sports stripes at 60 pt, not as a card.</li>
<li><b style="color:#efe7d6">E4 beam:</b> a dot and a wedge read as a megaphone or a “send” icon before they read as a projector.</li>
<li><b style="color:#efe7d6">E5 quarter fan:</b> reads as a pie chart or paint swatch, and its mass sits off-centre in the tile.</li></ul></section>
<section data-shot="motion"><span class="lbl">Animation</span><h2>End of the fan edit, top two</h2>
${anim('E6',[[fanP(),'The edit’s three posters, fanned'],[pos(-30,R)+pos(30,B)+pos(0,C),'Art drops away: the cards go flat red, cream, blue'],[E.E6.m('#000'),'Detail clears, keylines settle: the mark']])}
${anim('E3',[[fanP(),'The edit’s three posters, fanned'],[e3mid,'The middle poster drops out; red and blue close in'],[E.E3.m('#000'),'They lean apart and the overlap turns cream: the mark']])}</section>
<section data-shot="pick"><span class="lbl">Top two</span><h2>1. E6 solid fan · 2. E3 two cards</h2><p style="margin-top:8px;max-width:900px">E6 is the current logo distilled to an emblem: the silhouette people already know, three flat colours, no detail, so it holds at 16 and the fan animation ends on it with no change of shape at all. That continuity is why it is first. E3 is the bolder, more airline-like mark: two leaning cards and a cream overlap make a single confident shape that is more ownable than a fan, and the animation still ends on it naturally. E1 (wedge) is a good third and the most abstract; it reads as cinema light but loses the cards.</p></section>`;

</script></body></html>
