<script>
const I = (id, c) => `<svg${c ? ` class="${c}"` : ''}><use href="#${id}"/></svg>`;
const UP = 'file:///root/.claude/uploads/3b15a6fd-9770-5491-87a5-4cf8acc3cc2b/';

const phone = (inner, id, h) => `<div class="ph" id="${id}"${h ? ` style="height:${h}px"` : ''}>${inner}${chrome()}</div>`;
const col = (cap, sub, ph) => `<div class="col"><div class="kap">${cap}</div><div class="capsub">${sub}</div>${ph}</div>`;
const now = (f) => `<img class="nowimg" src="${UP}${f}">`;
const AVC = { E: '#7a5c48', S: '#48607a', J: '#5c6b4a', M: '#6d4a66', H: '#4a6a6d', A: '#7a6a3c', R: '#5a4a7a', N: '#6a4a4a' };
const av = (l, s) => `<span class="av" style="background:${AVC[l]}${s ? `;width:${s}px;height:${s}px` : ''}">${l}</span>`;
const tbar = (on) => `<div class="tbar">` + [['clap', 'Picks'], ['search', 'Browse'], ['popcorn', ''], ['users', 'Social'], ['drama', 'Profile']].map(([i, t]) => t ? `<div${t === on ? ' class="on"' : ''}>${I(i)}${t}</div>` : `<div><span class="pill">${I(i)}</span></div>`).join('') + `</div>`;
const drawer = (bg, top, body, foot) => `<img class="bgimg" src="${bg}"><div class="dim"></div><div class="dr" style="${top ? `top:${top}px` : ''}"><div class="grab"></div>${body}${foot ? `<div class="pinft">${foot}</div>` : ''}</div>`;
const dh = (t) => `<div class="dh"><h3>${t}</h3><span class="xc">${I('x')}</span></div>`;

const chips = (a, sel = []) => a.map((t) => chip(t, sel.includes(t))).join('');

/* A */
const mnd = (cta, also) => `<img class="amb" src="movienight-v3-img/bd-parasite.jpg"><div class="pgx mnd"><div class="top"><span class="back">${I('left')}</span><span class="lab">Movie night · Night 22</span><span style="width:36px"></span></div>`
  + `<h1>Parasite</h1><div class="m">2019 · 2h 12m · Bong Joon Ho</div><div class="tags"><span class="tag">4.4★</span><span class="tag">R</span></div>`
  + `<div class="pr"><div class="po"><img src="movienight-v3-img/po-parasite.jpg"><span class="stamp">Admit 3</span></div>`
  + `<div class="side"><div class="faces">${av('E')}${av('S')}<span class="av no" style="background:${AVC.J}">J</span></div><b>Won 2 of 3</b><span class="s">Emma and Sam voted for it</span><div class="yw">You're all watching</div></div></div>`

const a1 = mnd('Play on Max' + I('chev'), 'Also on Amazon Video · Rent');
const a2 = mnd('Where to watch', 'Rent on Apple TV or Amazon Video');
document.getElementById('s1').innerHTML =
  col('A · Now', 'A hero with the poster and title, then a ticket below that repeats it all.', now('9a8b8324-image.png'))
  + col('A1 · Like Tonight, on your service', "Tonight's chosen layout: title, stamped poster, who voted, one button. Nothing repeated, no ticket.", phone(a1, 'a1'))
  + col('A2 · Not on your services', 'Same screen. The one button becomes <b>Where to watch</b>; the line under it says where to rent.', phone(a2, 'a2'));

/* B */
const pb = 'poster-badges-v1-img/';
const ac = (c, n, role, me, d, ps, cnt, cmp, up) => `<div class="ac"><div class="h"><u style="background:${c}"></u><b>${n}</b><span${me ? ' class="me"' : ''}>${role}</span></div><p>${d}</p>`
  + `<div class="f">${ps.map((p) => `<img src="${p}">`).join('')}<div class="t"><b>${cnt} of your favorites${I('chev')}</b><span class="cmp${up ? ' up' : ''}">${cmp}</span></div></div></div>`;
const b1 = drawer('canon-v3-img/bd-fotr.jpg', 64, dh('Why Nihilist')
  + `<p class="lead">Your closest of 15 archetypes, from how you rate.</p>`
  + `<div class="mix"><i style="flex:40;background:var(--select)"></i><i style="flex:36;background:var(--ink)"></i><i style="flex:24;background:var(--faint)"></i></div>`
  + ac('var(--select)', 'Nihilist', 'Your archetype', 1, 'Bleak endings, grey morals, dread over relief.', [pb + 'se7en.jpg', pb + 'pulp.jpg', pb + 'oldboy.jpg'], 176, 'Much more than most', 1)
  + ac('var(--ink)', 'Lovestruck', 'Also in your mix', 0, 'Two people falling for each other, fast or slow.', [pb + 'lionking.jpg', pb + 'amelie.jpg', pb + 'pastlives.jpg'], 153, 'About as much as most')
  + ac('var(--faint)', 'IMAX Idealist', 'Also in your mix', 0, 'Big-screen films: action, franchises, event movies.', ['tier-list-v1-img/darkknight.jpg', pb + 'madmax.jpg', pb + 'space2001.jpg'], 84, 'About as much as most')

  + `<li>Role labels: sentence case, on the name's line.</li></ul>`

/* C */
const pt = (l, n, p, on) => `<div class="pt${on ? ' on' : ''}">${av(l)}<b>${n}</b><span class="pct">${p}<small>%</small></span>${on ? `<span class="ck">${I('check')}</span>` : ''}</div>`;

document.getElementById('s3').innerHTML =
  col('C1 · Just me', 'The drawer is only as tall as its content: the four choices and <b>Done</b>.', phone(c1, 'c1'))

/* D */
const social = (rowHtml) => `<div class="topbar"><img src="b34-next-v1-img/fan.svg" alt=""><span class="wm">Montage</span><span class="ib">${I('bell')}</span><span class="circ">${I('menu')}</span></div>`
  + `<div class="pgx" style="top:110px"><div class="tabs2"><span class="on">People</span><span>Groups</span><span class="sp"></span>${I('share')}${I('send')}</div>`
  + `<div class="sh"><h3>Your people</h3><span>See all 17</span></div>${rowHtml}`
  + `<div class="mn"><div class="l"><i>Movie night</i><h4>Start a movie night</h4><p>Everyone votes from films you'd all like</p><div class="who">${av('H')}${av('E')}<span>You, Emma, Sam and 2 more</span></div></div><div class="pf"></div><div class="r">Admit<br>all</div></div>`
  + `<div class="sh" style="margin-top:32px"><h3>Lately</h3><span>from your people</span></div>`
  + `<div class="fr">${av('E')}<div class="t"><b>Emma</b> rated<em>Past Lives</em><small>9h · you gave it 4★</small></div><img src="${pb}pastlives.jpg"></div>`

const ppl = [['J', 'Jacob', 95], ['E', 'Emma', 91], ['S', 'Sam', 88], ['M', 'Maya', 84], ['R', 'Ravi', 81], ['N', 'Nora', 79]];
const findSq = `<div class="sq pin">${I('search')}Find</div>`;
const d12 = (x) => social(`<div class="hrow${x ? ' scr' : ''}">${findSq}<div class="hsc" style="transform:translateX(${x}px)">${ppl.map((p) => pt(...p)).join('')}</div></div>`);

const e1 = lhead() + `<div class="grid">${gp.map(([p, m]) => `<div><img src="${p}"><span class="mb">${m}<small>%</small></span></div>`).join('')}</div>`;

  + `<div class="head"><h2>Heat</h2><div class="ms"><div class="n">93<small>%</small></div><span class="l">MATCH</span></div><div class="m">1995 · 2h 50m · Michael Mann</div></div></div></div>`

document.getElementById('s5').innerHTML =

  + col('E2 · Immersive', 'Same header, then the Picks swipe card for this lane, with a <b>3 of 9</b> count.', phone(e2, 'e2'));

/* F + H */

const bc = (img, n, c) => `<div class="bc"><img src="${img}"><div><b>${n}</b><span>${c} films</span></div></div>`;
const f = `<div class="pgx mf"><span class="back" style="display:grid;margin-top:4px">${I('left')}</span><h1>Made for you</h1><p class="sub">Mixes built from your taste. Refreshed weekly.</p>`

const h = drawer(tbg, 64, dh('Tonight')

/* G */

  + `<div class="rail">${[1, 0, 0, 0, 0, 0, 0, 0, 0].map((o) => `<i${o ? ' class="on"' : ''}></i>`).join('')}</div>`
  + `<div class="steps"><span>${I('left')}Whimsy</span><span>Darkness${I('chev')}</span></div>`
  + `<p class="hint">How hard a film grips: tension, stakes, pressure.</p>`
  + `<div class="fy"><i>For you</i><p>You rate high-intensity films <b>4.2★</b> on average, <b>0.6 above</b> your usual. <b>31 of your 50</b> favorites have it.</p></div>`
  + `<div class="eb">Receipts</div><div class="rc"><div><img src="${pb}se7en.jpg">5★</div><div><img src="${pb}uncutgems.jpg">4.5★</div><div><img src="${pb}oldboy.jpg">4.5★</div><div><img src="${pb}madmax.jpg">4.5★</div></div>`);
document.getElementById('s7').innerHTML =
  col('G · Strand drawer', 'The generic line is replaced by a sentence built from <b>your own numbers</b>.', phone(g, 'g1'))
