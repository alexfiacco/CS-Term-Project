<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#141417;--panel-2:#18181b;--line:#2a2a2e;--line-2:#3a3a3e;--ink:#efe8da;--muted:#a9a69e;--faint:#8a877f;--accent:#5b8fc4;--accent-2:#8fb3d9;--accent-soft:rgba(91,143,196,.14);--red:#c8233a}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;gap:24px;padding:24px;width:1275px;align-items:flex-start}
.col{width:393px}
.cap{font-size:12px;letter-spacing:.08em;color:var(--faint);margin:0 0 8px 4px;text-transform:uppercase;font-weight:500}
.cap b{color:var(--ink);font-weight:500}
.ph{width:393px;height:852px;background:var(--bg);border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.sb{height:48px;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0;font:600 16px Inter}
.sb i{font-style:normal;letter-spacing:2px;font-size:12px}
.hd{display:flex;align-items:center;gap:12px;padding:4px 16px 0}
.bk{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.ey{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase;flex:1}
.lk{font-size:14px;color:var(--accent-2);font-weight:500;height:44px;display:flex;align-items:center}
.bd{padding:8px 16px 0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.q p{margin:0;font:400 17px/1.4 Newsreader,serif}
.q .at{color:var(--accent-2)}
.av{width:24px;height:24px;border-radius:50%;background:#2f3a48;color:var(--accent-2);font:600 11px Inter;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.tr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin:8px 0 8px}
.tr svg{flex:0 0 auto}
.ans{font:400 16px/1.45 Newsreader,serif;margin:0 0 12px}
.ans b{font-weight:500}
.hist{display:flex;gap:8px;margin-bottom:12px}
.hi{flex:1;display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:6px;padding:8px}
.hi img{width:32px;height:48px;border-radius:2px;object-fit:cover}
.hi .t{font-size:13px;font-weight:500;line-height:1.25}
.hi .d{font-size:12px;color:var(--muted);margin-top:2px}
.h2{font:500 22px 'Bodoni Moda',serif;margin:0}
.bar{display:flex;gap:0;margin:8px 0 12px}.bar span{width:16px;height:2px;border-radius:2px}.bar .r{background:var(--red)}.bar .b{background:var(--accent)}
.picks{display:flex;gap:8px}
.pk{flex:1;min-width:0}
.pk img{width:100%;height:152px;object-fit:cover;border-radius:6px;display:block;box-shadow:0 0 0 1px var(--line-2)}
.pk .t{font-size:14px;font-weight:600;margin-top:8px;line-height:1.2}
.pk .m{font-size:12px;color:var(--accent-2);font-weight:500;margin-top:2px}
.pk .w{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);display:flex;align-items:center;font-size:13px;font-weight:500;white-space:nowrap}
.box{position:absolute;left:16px;right:16px;bottom:24px}
.in{height:52px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);display:flex;align-items:center;padding:0 4px 0 20px;font:400 16px Newsreader,serif;color:var(--faint)}
.in span{flex:1}
.mic{width:44px;height:44px;border-radius:50%;background:#0b0b0d;display:flex;align-items:center;justify-content:center}
.left{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}
.pair{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.4;margin:8px 0 4px}
.pair b{color:var(--ink);font-weight:500}
.row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row img{width:48px;height:72px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px var(--line-2)}
.row .t{font-size:15px;font-weight:600}
.row .y{font-size:12px;color:var(--muted);margin-top:4px}
.row .m{margin-left:auto;font-size:14px;color:var(--accent-2);font-weight:600}
.pro{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.pro a{color:var(--accent-2);font-weight:500;text-decoration:none;height:44px;display:flex;align-items:center;padding-left:12px}
</style></head><body>
<script>
const P=id=>`https://image.tmdb.org/t/p/w185/${id}.jpg`;
const PL=P('k3waqVXSnvCZWfJYNtdamTgTtTA'),AF=P('kQs6keheMwCxJxrzV83VUwFtHkB'),AR=P('x2FJsf1ElAgr63Y3PNPtJrcmpoe'),PA=P('7IiTTgloJzvGI1TAYymCfbfl3vT'),WH=P('7fn624j5lj3xTme2SgiLCeuedmO'),IN=P('gEU2QniE6E77NI6lCU6MxlNBvIx'),EE=P('w3LxiVYdWWRvEVdn5RYq6jIqkb1');
const chev=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#efe8da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
const micI=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#efe8da" stroke-width="1.75" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const look=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a877f" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`;
const hdr=`<div class="sb"><span>9:41</span><i>●●● ▮</i></div><div class="hd"><div class="bk">${chev}</div><span class="ey">Your pitch</span><span class="lk">New pitch</span></div>`;
const q=`<div class="q"><div class="av">S</div><p>What did <span class="at">@Sam</span> and I watch last month, and what should we watch next?</p></div>`;
const deep=`<div class="tr">${look}Checked your diary, Sam's, and both watchlists</div>
<p class="ans">You and Sam watched two films in October. You both gave <b>Past Lives</b> 4½★; Sam liked <b>Anatomy of a Fall</b> more than you did.</p>
<div class="hist"><div class="hi"><img src="${PL}"><div><div class="t">Past Lives</div><div class="d">Oct 10 · both 4½★</div></div></div><div class="hi"><img src="${AF}"><div><div class="t">Anatomy of a Fall</div><div class="d">Oct 24 · you 3½★</div></div></div></div>
<h2 class="h2">Next for you and Sam</h2><div class="bar"><span class="r"></span><span class="b"></span></div>
<div class="picks">
<div class="pk"><img src="${AR}"><div class="t">Arrival</div><div class="m">94% for you both</div><div class="w">On both your watchlists</div></div>
<div class="pk"><img src="${PA}"><div class="t">Parasite</div><div class="m">92% for you both</div><div class="w">Sam gave it 5★. New to you</div></div>
<div class="pk"><img src="${WH}"><div class="t">Whiplash</div><div class="m">90% for you both</div><div class="w">Tense like the October pair</div></div>
</div>
<div class="chips"><span class="chip">Shorter</span><span class="chip">Why this one?</span><span class="chip">Something lighter</span></div>`;
const box=(extra)=>`<div class="box"><div class="in"><span>Ask a follow-up</span><div class="mic">${micI}</div></div>${extra||''}</div>`;
const row=(img,t,y,m)=>`<div class="row"><img src="${img}"><div><div class="t">${t}</div><div class="y">${y}</div></div><div class="m">${m}</div></div>`;
const out=`<h2 class="h2" style="margin-top:16px">Films for you and Sam</h2><div class="bar"><span class="r"></span><span class="b"></span></div>
<p class="pair" style="margin-top:0"><span>Sorted for <b>you and Sam</b>: the lower of your two matches leads, your Blend's films first.</span></p>
${row(AR,'Arrival','2016 · 1h 56m','94%')}${row(PA,'Parasite','2019 · 2h 13m','92%')}${row(WH,'Whiplash','2014 · 1h 47m','90%')}${row(IN,'Interstellar','2014 · 2h 49m','88%')}
<div class="pro"><span>Montage Pro can dig into your history for this.</span><a>See Pro</a></div>`;
const frames=[
 ['1 · <b>Pro</b>, deep ask',hdr+`<div class="bd">${q}${deep}</div>`+box()],
 ['2 · <b>Free</b>, 2 of 3 deep asks left',hdr+`<div class="bd">${q}${deep}</div>`+box('<div class="left">2 deep asks left this week</div>')],
 ['3 · <b>Free</b>, out of deep asks',hdr+`<div class="bd">${q}${out}</div>`+box()]];
document.body.innerHTML=frames.map(([c,h])=>`<div class="col"><p class="cap">${c}</p><div class="ph">${h}</div></div>`).join('');
</script></body></html>
