<!doctype html><html><head><meta charset="utf-8"><title>Archetype names</title><style>
@font-face{font-family:"Bodoni Moda";font-weight:600;src:url("file:///home/user/montage/assets/fonts/BodoniModa-SemiBold.ttf")}
@font-face{font-family:"Newsreader";font-weight:400;src:url("file:///home/user/montage/assets/fonts/Newsreader-Regular.woff")}
@font-face{font-family:"Inter";font-weight:600;src:url("file:///home/user/montage/assets/fonts/Inter-SemiBold.woff")}
:root{--bg:#0b0b0d;--line:#2a2a2e;--ink:#efe8da;--muted:#a9a69e;--accent:#5b8fc4;--accent-2:#8fb3d9;--accent-soft:rgba(91,143,196,.14)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);width:390px;font-family:Inter,system-ui,sans-serif}
.half{padding:8px 16px 24px;background:var(--bg)}
section{padding-top:24px}
.sec{font:600 11px/1.3 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);margin-bottom:12px}
.card{background:#141416;border:1px solid var(--line);border-radius:12px;padding:12px 16px 16px;margin-top:8px}
.card.pick{border-color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;height:20px}
.lab{font:600 11px/1.3 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;gap:6px}
.tag{font:600 10px/1 Inter;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.tag.p{color:var(--accent-2);background:var(--accent-soft);border-color:transparent}
.name{font:600 34px/1.1 "Bodoni Moda",Georgia,serif;margin-top:6px;white-space:nowrap}
.tl{font:400 16px/1.35 Newsreader,Georgia,serif;color:var(--muted);margin-top:4px}
</style></head><body><script>
const D=[
["Here for the laugh.",["Comic Relief","Class Clown"],0],
["Animation is the medium, not the genre.",["Animation Devotee","Saturday Morning","Daydreamer"],1],
["Other worlds, and the journey there.",["Voyager","Escapist","Worldbuilder"],1],
["Drawn to the true story.",["Chronicler","Witness"],1],
["Follows directors, not titles.",["Auteurist","Disciple","Completist","Groupie"],1],
["Always piecing it together.",["Theorist","Overthinker","Detective","Puzzler"],1]];
let h="";D.forEach(([t,ns,p],i)=>{if(i%3==0)h+=(i?"</div>":"")+'<div class="half">';
h+=`<section><div class="sec">${i+1} of 6 · ${ns[0]}</div>`+ns.map((n,j)=>`<div class="card${j==p?" pick":""}"><div class="top"><div class="lab">Your archetype</div><div class="tags">${j==0?'<span class="tag">Current</span>':""}${j==p?'<span class="tag p">Pick</span>':""}</div></div><div class="name">${n}</div><div class="tl">${t}</div></div>`).join("")+"</section>"});
document.body.innerHTML=h+"</div>";
</script></body></html>
