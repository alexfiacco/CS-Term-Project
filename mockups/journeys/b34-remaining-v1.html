<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>B34 remaining v1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="brand-v2-base.css">
<style>
/* b34-remaining-v1: seven small items for build 34. Mock only, no app code changed. Tokens from brand-v2-base.css
   (montage app/globals.css :root); component metrics from .fa-row/.fa-rate, .pk-*, .mood-seg, .bh-mfy-*, .people-*.
   Inter stands in for SF. */
@font-face { font-family: "Bodoni App"; font-weight: 500 600; src: url("file:///home/user/montage/assets/fonts/BodoniModa-SemiBold-opsz20.ttf"); }
@font-face { font-family: "Newsreader App"; font-weight: 400; src: url("file:///home/user/montage/assets/fonts/Newsreader-Regular.woff"); }
:root { --ui: "Inter", -apple-system, system-ui, sans-serif; --read: "Newsreader App", Georgia, serif; --serif: "Bodoni App", Georgia, serif; --cream: #efe8da; --cream-ink: #17150f; --perf: #b8ae9a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 390px; background: #050506; color: var(--ink); font: 400 15px/20px var(--ui); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sheet { width: 390px; padding-bottom: 16px; }
.lab { height: 36px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font: 600 11px/14px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lab b { color: var(--ink); font-weight: 700; }
.fr { position: relative; width: 390px; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px; overflow: hidden; }
img.po { display: block; object-fit: cover; border-radius: 6px; filter: var(--grade); background: var(--panel-2); }
.faint { color: var(--faint); } .muted { color: var(--muted); }

/* 1 rating lock */
.f-title { margin: 0; font: 600 28px/32px var(--serif); letter-spacing: -.01em; }
.f-facts { margin-top: 4px; font: 400 13px/18px var(--ui); color: var(--faint); }
.fa-row { margin-top: 16px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 64px; border-radius: 12px; background: var(--panel); }
.fa-act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px/16px var(--ui); color: var(--muted); }
.fa-act svg { width: 22px; height: 22px; color: var(--ink); }
.fa-act.on svg { color: var(--select); fill: currentColor; }
.fa-rate { display: flex; align-items: center; gap: 4px; min-height: 44px; margin-top: 12px; }
.stars { display: inline-flex; gap: 6px; height: 44px; align-items: center; padding: 0 8px; margin-left: -8px; border-radius: 999px; border: 1.5px solid transparent; }
.stars span { width: 30px; height: 30px; font-size: 33px; line-height: 30px; text-align: center; color: var(--accent-2); }
.stars.live { background: var(--select-fill); border-color: var(--select-edge); }
.pen { width: 44px; height: 44px; display: grid; place-items: center; }
.pen i { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--muted); }
.pen svg { width: 15px; height: 15px; }
.pen.on i { background: var(--select-deep); border-color: var(--select-deep); color: #fff; }
.fa-note { margin-left: auto; white-space: nowrap; font: 400 13px/18px var(--ui); color: var(--faint); }

/* 2 picks card bottom */
.pk { padding: 0; height: 312px; }
.pk .art { position: absolute; left: 0; top: -390px; width: 390px; height: 585px; object-fit: cover; filter: var(--grade); }
.pk .scr { position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(rgba(11,11,13,0), rgba(11,11,13,.6) 30%, rgba(11,11,13,.86) 62%, rgb(11,11,13)); }
.pk .head { position: absolute; left: 16px; right: 16px; top: 112px; display: flex; gap: 16px; }
.pk .t { flex: 1; min-width: 0; }
.pk h2 { margin: 0; font: 600 24px/28px var(--serif); letter-spacing: -.01em; }
.pk .m { margin-top: 4px; display: flex; align-items: center; gap: 8px; font: 400 13px/20px var(--ui); color: var(--muted); white-space: nowrap; }
.pk .m img { width: 18px; height: 18px; border-radius: 4px; display: block; }
.pk .w { margin-top: 4px; font: italic 400 14px/20px Georgia, serif; white-space: nowrap; font-family: "Newsreader", "Newsreader App", Georgia, serif; color: var(--muted); }
.pk .w a { font-style: normal; font-family: var(--read); color: var(--accent-2); }
.pk .ms { flex: none; text-align: right; }
.pk .ms .n { font: 600 32px/28px var(--serif); color: var(--accent-2); }
.pk .ms .n small { font-size: 15px; }
.pk .ms .l { display: block; margin-top: 8px; font: 600 11px/14px var(--ui); letter-spacing: 1.5px; color: var(--faint); }
.stub { position: absolute; left: 16px; right: 16px; top: 232px; height: 64px; display: flex; background: var(--cream); color: var(--cream-ink); border-radius: 12px; }
.stub::before, .stub::after { content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--bg); }
.stub::before { left: -7px; } .stub::after { right: -7px; }
.stub .pf { width: 0; border-left: 1px dashed var(--perf); margin: 2px 0; }
.stub .p { flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; font: 600 15px/18px var(--ui); white-space: nowrap; }

/* 4 lately */
.lt-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.lt-h b { font: 600 22px/28px var(--serif); } .lt-h span { font: 400 13px/18px var(--ui); color: var(--faint); }
.lt { display: flex; gap: 12px; }
.av { flex: none; width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 15px/1 var(--ui); background: #d9b56a; color: #17150f; }
.lt .b { flex: 1; min-width: 0; }
.lt .who { font: 400 15px/20px var(--ui); color: var(--muted); } .lt .who b { color: var(--ink); font-weight: 600; }
.lt .ttl { margin-top: 4px; font: 600 20px/24px var(--serif); }
.lt .pos { display: flex; gap: 4px; margin-top: 12px; }
.lt .pos img { width: 72px; height: 108px; }
.lt .n { margin-top: 8px; font: 400 13px/18px var(--ui); color: var(--faint); }
.lt .acts { display: flex; gap: 16px; margin-top: 12px; height: 28px; align-items: center; color: var(--muted); }

/* 3 visibility */
.dr { background: var(--panel); border-radius: 12px 12px 0 0; margin: 0 -16px -16px; padding: 8px 16px 24px; border-top: 1px solid var(--line); }
.grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line-2); margin: 0 auto 16px; }
.dr h3 { margin: 0; font: 600 22px/28px var(--serif); }
.dr p { margin: 8px 0 0; font: 400 16px/24px var(--read); color: var(--muted); }
.field { margin-top: 16px; height: 48px; border-radius: 12px; border: 1px solid var(--line-2); display: flex; align-items: center; padding: 0 16px; font: 400 16px/24px var(--ui); }
.seglab { margin: 16px 0 8px; font: 600 11px/14px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; }
.seg span { flex: 1; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px/20px var(--ui); color: var(--muted); white-space: nowrap; }
.seg span.on { background: var(--select-deep); color: #fff; }
.seg svg { width: 14px; height: 14px; }
.hint { margin-top: 8px; font: 400 13px/18px var(--ui); color: var(--faint); }
.btn { margin-top: 16px; height: 48px; border-radius: 999px; background: var(--cream); color: var(--cream-ink); display: flex; align-items: center; justify-content: center; font: 600 16px/20px var(--ui); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line-2); margin-top: 8px; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 16px; font: 500 15px/20px var(--ui); color: var(--muted); }
.tabs span { padding-bottom: 10px; } .tabs .on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 -1px var(--select); border-bottom: 2px solid var(--select); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.lc .strip { display: flex; gap: 0; border-radius: 6px; overflow: hidden; height: 86px; }
.lc .strip img { flex: 1; min-width: 0; height: 86px; object-fit: cover; filter: var(--grade); }
.lc b { display: block; margin-top: 8px; font: 600 18px/22px var(--serif); }
.lc .m { margin-top: 4px; display: flex; align-items: center; gap: 4px; font: 400 13px/18px var(--ui); color: var(--faint); }
.lc .m svg { width: 12px; height: 12px; }

/* 5 made for you */
.cap2 { display: flex; align-items: center; padding-bottom: 8px; margin-bottom: 12px; font: 600 11px/14px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cap2 span { margin-left: auto; text-transform: none; letter-spacing: 0; font: 500 13px/18px var(--ui); color: var(--muted); display: flex; align-items: center; gap: 2px; }
.cap2 svg { width: 14px; height: 14px; color: var(--faint); }
.row { display: flex; gap: 12px; margin-right: -16px; overflow: hidden; }
.bdc { position: relative; flex: 0 0 328px; height: 200px; border-radius: 12px; overflow: hidden; background: var(--panel-2); }
.bdc > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--grade); }
.bdc .g { position: absolute; inset: 0; background: linear-gradient(rgba(11,11,13,0) 24%, rgba(11,11,13,.62) 58%, rgba(11,11,13,.94)); }
.bdc .tx { position: absolute; left: 16px; right: 16px; bottom: 12px; }
.bdc .tx b { display: block; font: 600 22px/26px var(--serif); letter-spacing: -.005em; }
.bdc .tx span { display: block; margin-top: 4px; font: 400 13px/18px var(--ui); color: var(--muted); }
.bdc .ins { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; }
.bdc .ins img { width: 32px; height: 48px; border-radius: 2px; object-fit: cover; box-shadow: 0 1px 6px rgba(0,0,0,.5); filter: var(--grade); }
.mfy { flex: 0 0 296px; }
.mfy .ps { display: flex; gap: 4px; } .mfy .ps img { width: 96px; height: 144px; }
.mfy b { display: block; margin-top: 8px; font: 500 15px/20px var(--ui); }
.mfy span { display: block; margin-top: 2px; font: 400 13px/16px var(--ui); color: var(--faint); }

/* 6 ticket */
.pname { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.pname .av { width: 56px; height: 56px; background: var(--panel-2); color: var(--ink); font: 600 24px/1 var(--serif); }
.pname b { font: 600 28px/32px var(--serif); }
.tk { position: relative; display: flex; height: 64px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel); }
.tk .st { flex: 1; display: flex; align-items: center; padding-left: 16px; }
.tk .st div { flex: 1; } .tk .st b { display: block; font: 600 20px/24px var(--ui); font-variant-numeric: tabular-nums; }
.tk .st span { display: flex; align-items: center; gap: 2px; font: 400 12px/16px var(--ui); color: var(--muted); } .tk .st svg { width: 12px; height: 12px; }
.tk .end { position: relative; flex: none; width: 44px; margin: -1px -1px -1px 0; border-radius: 0 12px 12px 0; background: var(--cream); color: var(--cream-ink); display: grid; place-items: center; border-left: 1px dashed var(--perf); }
.tk .end::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 3px; background: var(--red); }
.tk .end::after { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 3px; background: var(--select); }
.tk .end em { font-style: normal; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 12px/14px var(--ui); letter-spacing: .04em; margin-left: 8px; font-variant-numeric: tabular-nums; }
.tk .nt { position: absolute; right: 36px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); z-index: 1; }
.tk .nt.a { top: -8px; } .tk .nt.b { bottom: -8px; }
.scrim { height: 56px; margin: -16px -16px 0; background: linear-gradient(#050506, rgba(5,5,6,.6)); }
.big { position: relative; margin: 16px auto 0; width: 232px; height: 88px; display: flex; border-radius: 12px; background: var(--cream); color: var(--cream-ink); overflow: hidden; }
.big::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--red); }
.big::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 6px; background: var(--select); }
.big div { flex: 1; padding-left: 28px; display: flex; flex-direction: column; justify-content: center; }
.big small { font: 600 11px/14px var(--ui); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.big b { margin-top: 4px; font: 600 28px/32px var(--ui); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.big i { flex: none; width: 56px; border-left: 2px dashed var(--perf); display: grid; place-items: center; }
.big i svg { width: 24px; height: 24px; opacity: .8; }
</style></head><body>
<div id="app"></div>
<script>
const P = {
  pencil: '<path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8L2 21.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/><path d="m15 5 4 4"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  msg: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  bm: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  list: '<path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
};
const I = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const L = 'lanes-more-v1-img/', T = 'tier-list-v1-img/', N = 'b34-remaining-v1-img/';
const fr = (lab, html, cls = '') => `<div class="lab">${lab}</div><div class="fr ${cls}">${html}</div>`;
const film = (live) => `<h2 class="f-title">The Godfather</h2><div class="f-facts">1972 · 2h 55m · Francis Ford Coppola</div>
  <div class="fa-row"><div class="fa-act on">${I('bm')}Rewatch</div><div class="fa-act">${I('list')}Lists</div><div class="fa-act">${I('star')}Canon</div><div class="fa-act">${I('send')}Send</div></div>
  <div class="fa-rate"><div class="stars${live ? ' live' : ''}">${'<span>★</span>'.repeat(5)}</div><div class="pen${live ? ' on' : ''}"><i>${I('pencil')}</i></div>${live ? '<span class="fa-note">Tap to change</span>' : ''}</div>`;
const tk = (end) => `<div class="tk"><div class="st"><div><b>12</b><span>films ${I('chev')}</span></div><div><b>0</b><span>followers ${I('chev')}</span></div><div><b>0</b><span>following ${I('chev')}</span></div></div><i class="nt a"></i><i class="nt b"></i><div class="end"><em>${end}</em></div></div>`;
const s1 = [
  fr('<b>1</b> Rating lock · locked', film(false)),
  fr('<b>1</b> Rating lock · editing', film(true)),
  fr('<b>2</b> Picks card bottom', `<img class="art" src="${N}po-america.jpg"><div class="scr"></div>
    <div class="head"><div class="t"><h2>Once Upon a Time in America</h2><div class="m">1984 · 3h 49m · Sergio Leone <img src="${N}prime2.jpg" alt="Prime Video"></div>
    <div class="w">Because you loved <a>The Godfather</a> &amp; <a>GoodFellas</a></div></div><div class="ms"><span class="n">85<small>%</small></span><span class="l">MATCH</span></div></div>
    <div class="stub"><div class="p">${I('eye')}Seen it</div><div class="pf"></div><div class="p">${I('bm')}Watchlist</div><div class="pf"></div><div class="p">${I('x')}Not for me</div></div>`, 'pk'),
  fr('<b>4</b> Lately · a new list', `<div class="lt-h"><b>Lately</b><span>from your people</span></div>
    <div class="lt"><div class="av">S</div><div class="b"><div class="who"><b>Sam</b> made a list</div><div class="ttl">Nolan, ranked</div>
    <div class="pos"><img class="po" src="${T}darkknight.jpg"><img class="po" src="${T}prestige.jpg"><img class="po" src="${T}interstellar.jpg"></div>
    <div class="n">12 films · 2d</div><div class="acts">${I('heart')}${I('msg')}${I('send')}</div></div></div>`),
];
const card = (t, m, ps, lock) => `<div class="lc"><div class="strip">${ps.map((p) => `<img src="${p}">`).join('')}</div><b>${t}</b><div class="m">${m}${lock ? ` · ${I('lock')} Only me` : ''}</div></div>`;
const cap = `<div class="cap2">Made for you<span>All 9${I('chev')}</span></div>`;
const s2 = [
  fr('<b>3</b> List visibility picker', `<div class="dr" style="margin-top:-16px;border-radius:0;border-top:0"><div class="grab"></div><h3>New list</h3><div class="field">Comfort rewatches</div>
    <div class="seglab">Who can see it</div><div class="seg"><span>${I('globe')}Public</span><span>${I('users')}Friends</span><span class="on">${I('lock')}Only me</span></div>
    <div class="hint">Only you can see this list.</div><div class="btn">Create list</div></div>`),
  fr('<b>3</b> Your Lists tab · the lock on a private list', `<div class="tabs"><span>Taste</span><span>Films</span><span class="on">Lists</span><span>Watchlist</span></div><div class="cards">
    ${card('Comfort rewatches', '9 films', [T + 'inception.jpg', T + 'memento.jpg', T + 'dunkirk.jpg'], true)}${card('Crime, ranked', '44 films · 12 saves', [L + 'godfather.jpg', L + 'goodfellas.jpg', L + 'departed.jpg'])}</div>`),
  fr('<b>5</b> Made for you · A backdrop card', `${cap}<div class="row">
    <div class="bdc"><img src="${N}bd-godfather.jpg"><div class="g"></div><div class="ins"><img src="${L}godfather.jpg"><img src="${L}goodfellas.jpg"><img src="${L}departed.jpg"></div><div class="tx"><b>Because you like organized crime families</b><span>8 films</span></div></div>
    <div class="bdc"><img src="${N}bd-goodfellas.jpg"><div class="g"></div><div class="tx"><b>Slow burns</b><span>12 films</span></div></div></div>`),
  fr('<b>5</b> Made for you · B poster strip, 2 lines', `${cap}<div class="row">
    <div class="mfy"><div class="ps"><img class="po" src="${L}godfather.jpg"><img class="po" src="${L}goodfellas.jpg"><img class="po" src="${L}departed.jpg"></div><b>Because you like organized crime families</b><span>8 films</span></div>
    <div class="mfy"><div class="ps"><img class="po" src="picks-immersive-v1-img/po-heat.jpg"><img class="po" src="${T}insomnia.jpg"><img class="po" src="${T}memento.jpg"></div><b>Slow burns</b><span>12 films</span></div></div>`),
];
const drawer = (h, p, big, btns) => `<div class="scrim"></div><div class="dr" style="margin-top:0"><div class="grab"></div><h3>${h}</h3><p>${p}</p>${big}${btns}</div>`;
const big = (n, lock) => `<div class="big"><div><small>Member</small><b>${n}</b></div><i>${lock ? I('lock') : I('star')}</i></div>`;
const s3 = [
  fr('<b>6</b> Guest ticket · "Guest" on the cream end', `<div class="pname"><div class="av">G</div><b>Guest</b></div>${tk('Guest')}`),
  fr('<b>6</b> Tap the end as a guest', drawer('Claim your member number', 'Save your account and the next number is yours for good.', big('0 0 2 3', true), '<div class="btn">Save my account</div><div class="btn ghost">Not now</div>')),
  fr('<b>6</b> Tap the end as a member', drawer('Member 0023', 'You were the 23rd person to join Montage.', big('0 0 2 3', false), '<div class="btn">Share profile</div>')),
];
document.getElementById('app').innerHTML = [s1, s2, s3].map((s, k) => `<div class="sheet" id="s${k + 1}">${s.join('')}</div>`).join('');
Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script></body></html>
