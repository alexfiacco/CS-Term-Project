<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picks backdrop v3</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=block" rel="stylesheet">
<link rel="stylesheet" href="brand-v2-base.css">
<style>
/* picks-backdrop-v2 (owner, 2026-11-10): the Picks still card (PicksScreen.swift stillFace, rule 1426) stretches a 16:9
   still over the whole 390 x 607 card (2.8x zoom). NOW beside A (whole frame, 16:9), B (390 x 340, 1.55x, on the subject),
   C (B over a blurred, darkened copy). A/B/C carry the text and logo fixes. Mock only: no app code changed. Inter stands in for SF. */
@font-face { font-family: "Bodoni App"; font-weight: 600; src: url("file:///home/user/montage/assets/fonts/BodoniModa-SemiBold-opsz20.ttf"); }
:root { --ui: "Inter", -apple-system, system-ui, sans-serif; --read: "Newsreader", Georgia, serif; --serif: "Bodoni Moda", Georgia, serif; --perf: #b8ae9a; --g: 11,11,13; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #050506; color: var(--ink); }
.lu { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.fill { fill: currentColor; stroke: none; }
.sheet { width: max-content; padding: 32px; display: flex; gap: 32px; align-items: flex-start; }
.col { width: 390px; flex: none; }
.cap { font: 600 22px/28px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }
.capsub { font: 400 17px/24px var(--ui); color: var(--muted); margin: 0 0 16px; min-height: 96px; }
.capsub b { color: var(--ink); font-weight: 600; }
.ph { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); border-radius: 12px; border: 1px solid var(--line); }
.ph > * { position: absolute; }
.art { left: 0; top: 154px; width: 390px; object-fit: cover; filter: var(--grade); }
.amb { left: -40px; top: 154px; width: 470px; height: 607px; object-fit: cover; filter: blur(44px) saturate(1.4) brightness(.62); }
.scr { left: 0; width: 100%; pointer-events: none; }
.hdr { left: 0; top: 0; width: 100%; height: 154px; background: var(--bg); }
.hfade { top: 154px; height: 40px; background: linear-gradient(rgb(var(--g)), rgba(var(--g),0)); }
.status { top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px 0 44px; font: 600 16px/1 var(--ui); color: #fff; }
.status .r { display: flex; gap: 6px; align-items: center; }
.status .bat { width: 26px; height: 12px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,.5); position: relative; }
.status .bat::after { content: ""; position: absolute; inset: 1.5px 8px 1.5px 1.5px; background: #fff; border-radius: 2px; }
.island { top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 999px; background: #000; }
.topbar { top: 54px; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 1px; padding: 0 12px 0 10px; }
.topbar img { width: 44px; height: 44px; }
.topbar .wm { flex: 1; font: 600 28px/1 "Bodoni App", var(--serif); padding-top: 3px; }
.topbar .ib { width: 44px; height: 44px; display: grid; place-items: center; }
.topbar .circ { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; margin-left: 6px; }
.topbar svg { width: 20px; height: 20px; }
.tags { top: 110px; left: 0; right: 0; height: 44px; display: flex; gap: 24px; padding: 0 16px; white-space: nowrap; }
.tags span { display: flex; align-items: center; font: 600 15px/20px var(--ui); color: var(--muted); position: relative; }
.tags span.on { color: var(--ink); }
.tags span.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--select); }
/* The block: poster row then the title block, bottom-anchored 16 over the stub (691). */
.blk { left: 16px; right: 16px; bottom: 169px; display: flex; flex-direction: column; gap: 16px; }
.prow { display: flex; align-items: flex-end; gap: 16px; }
.inset { width: 96px; height: 144px; border-radius: 2px; object-fit: cover; box-shadow: 4px 4px 0 var(--shadow); filter: var(--grade); flex: none; }
.trl { height: 36px; padding: 0 12px; border-radius: 999px; background: rgba(var(--g),.55); border: 1px solid rgba(239,232,218,.18); display: flex; align-items: center; gap: 6px; font: 600 13px/16px var(--ui); }
.trl svg { width: 12px; height: 12px; color: var(--accent-2); }
.snd { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: rgba(var(--g),.55); border: 1px solid rgba(239,232,218,.22); display: grid; place-items: center; }
.snd svg { width: 18px; height: 18px; }
.head { display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 12px; row-gap: 8px; }
.head h2 { margin: 0; grid-column: 1; font: 500 34px/38px var(--serif); }
.head .m { grid-column: 1; font: 400 15px/20px var(--ui); color: var(--muted); white-space: nowrap; display: flex; align-items: center; }
.head .lg { flex: none; object-fit: cover; }
.head .fr { grid-column: 1 / -1; font: 400 13px/18px var(--ui); color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.head .fr b { color: var(--ink); font-weight: 600; }
.head .w { grid-column: 1 / -1; font: italic 400 15px/20px var(--read); color: var(--muted); }
.head .w a { font-style: normal; color: var(--accent-2); }
.ms { grid-column: 2; grid-row: 1 / span 2; text-align: right; align-self: start; }
.ms .n { font: 500 28px/32px var(--serif); color: var(--accent-2); font-variant-numeric: lining-nums; }
.ms .n small { font-size: 13px; }
.ms .l { display: block; margin-top: 4px; font: 600 11px/14px var(--ui); letter-spacing: 1.5px; color: var(--faint); }
/* NOW: the logo as built, small and tight to the director. */
.now .lg { width: 14px; height: 14px; border-radius: 3px; margin-left: 4px; }
/* A/B/C: the fixes. */
.fix .head h2 { font: 500 36px/40px var(--serif); }
.fix .head .m { grid-column: 1 / -1; font: 400 17px/24px var(--ui); }
.fix .head .lg { width: 24px; height: 24px; border-radius: 6px; margin-left: 8px; }
.fix .head .fr { font: 400 16px/24px var(--ui); }
.fix .head .fr .lg { margin-left: 0; }
.fix .head .w { font: italic 400 17px/24px var(--read); }
.fix .ms { grid-row: 1; }
.fix .ms .l { margin-top: 0; line-height: 12px; }
.fix .ms .n { line-height: 30px; }
.stub { left: 16px; right: 16px; top: 691px; height: 56px; display: flex; background: var(--cream); color: var(--cream-ink); border-radius: 12px;
  -webkit-mask: radial-gradient(circle 7px at 0 50%, transparent 98%, #000) , radial-gradient(circle 7px at 100% 50%, transparent 98%, #000); -webkit-mask-composite: source-in; mask-composite: intersect; }
.stub .pf { width: 0; border-left: 1px dashed var(--perf); margin: 2px 0; }
.stub .p { flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; font: 600 13px/16px var(--ui); white-space: nowrap; }
.stub svg { width: 20px; height: 20px; }
.tbar { left: 0; right: 0; top: 761px; height: 83px; border-top: 1px solid var(--line); background: #121214; display: flex; justify-content: space-around; padding: 8px 8px 0; }
.tbar div { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px/14px var(--ui); color: var(--faint); }
.tbar div.on { color: var(--ink); } .tbar div.on svg { color: var(--accent-2); }
.tbar svg { width: 22px; height: 22px; }
.tbar .pill { width: 50px; height: 38px; border-radius: 12px; background: var(--ink); color: var(--cream-ink); display: grid; place-items: center; }
.tbar .pill svg { color: var(--cream-ink); }
.homeb { bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 999px; background: rgba(239,232,218,.7); }
/* v3 (owner, 2026-11-10): four takes on option C (C1-C4) plus the "Showing less" status line (L1, L2). */
.capsub { min-height: 72px; }
.tags.br span { color: rgba(239,232,218,.82); } .tags.br span.on { color: var(--ink); }
.c4 .inset { width: 72px; height: 108px; }
.l1 .blk { bottom: 205px; }
.sl { display: flex; align-items: center; font: 400 14px/20px var(--ui); color: var(--muted); white-space: nowrap; }
.sl a { color: var(--accent-2); font-weight: 600; height: 44px; display: flex; align-items: center; padding-left: 16px; }
.sl.linev { left: 16px; right: 16px; top: 643px; height: 44px; justify-content: space-between; }
.sl.pillv { left: 16px; top: 166px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(var(--g),.72); border: 1px solid rgba(239,232,218,.16); color: #cfcabf; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="eye" viewBox="0 0 24 24"><path class="lu" d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle class="lu" cx="12" cy="12" r="3"/></symbol>
  <symbol id="bm" viewBox="0 0 24 24"><path class="lu" d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path class="lu" d="M18 6 6 18"/><path class="lu" d="m6 6 12 12"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path class="lu" d="M10.268 21a2 2 0 0 0 3.464 0"/><path class="lu" d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path class="lu" d="M4 6h16"/><path class="lu" d="M4 12h16"/><path class="lu" d="M4 18h16"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path class="fill" d="M6 3v18l15-9z"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path class="lu" d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path class="lu" d="m21.854 2.147-10.94 10.939"/></symbol>
  <symbol id="clap" viewBox="0 0 24 24"><g class="lu"><path d="m12.296 3.464 3.02 3.956"/><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m6.18 5.276 3.1 3.899"/></g></symbol>
  <symbol id="search" viewBox="0 0 24 24"><g class="lu"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></symbol>
  <symbol id="popcorn" viewBox="0 0 24 24"><g class="lu"><path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4"/><path d="M10 22 9 8"/><path d="m14 22 1-14"/><path d="M20 8c.5 0 .9.4.8 1l-2.6 12c-.1.5-.7 1-1.2 1H7c-.6 0-1.1-.4-1.2-1L3.2 9c-.1-.6.3-1 .8-1Z"/></g></symbol>
  <symbol id="users" viewBox="0 0 24 24"><g class="lu"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></g></symbol>
  <symbol id="drama" viewBox="0 0 24 24"><g class="lu"><path d="M10 11h.01"/><path d="M14 6h.01"/><path d="M18 6h.01"/><path d="M6.5 13.1h.01"/><path d="M22 5c0 9-4 12-6 12s-6-3-6-12c0-2 2-3 6-3s6 1 6 3"/><path d="M17.4 9.9c-.8.8-2 .8-2.8 0"/><path d="M10.1 7.1C9 7.2 7.7 7.7 6 8.6c-3.5 2-4.7 3.9-3.7 5.6 4.5 7.8 9.5 8.4 11.2 7.4.9-.5 1.9-2.1 1.9-4.7"/><path d="M9.1 16.5c.3-1.1 1.4-1.7 2.4-1.4"/></g></symbol>
</defs></svg>
<div class="sheet" id="s1"></div>
<div class="sheet" id="s2"></div>
<div class="sheet" id="s3"></div>
<script>
const I = (id) => `<svg><use href="#${id}"/></svg>`;
const img = (f) => 'picks-backdrop-v2-img/' + f;
const BD = img('bd-st12.jpg'), PO = img('po-st12.jpg'), LG = img('prime1.jpg');
function phone(v) {
  const amb = (st) => `<img class="amb" src="${BD}" style="${st || ''}">`;
  const art = (h, mask, extra) => `<img class="art" src="${BD}" style="height:${h}px;object-position:22% 50%;-webkit-mask-image:${mask};mask-image:${mask};${extra || ''}">`;
  const m1 = 'linear-gradient(#000 52%, rgba(0,0,0,.45) 78%, transparent)';
  const lo = `<div class="scr" style="top:154px;height:607px;background:linear-gradient(rgba(var(--g),0) 55%, rgba(var(--g),.3) 100%)"></div>`;
  const line = `<span>Showing less crime for now</span><a>Undo</a>`;
  let h = '', top = true, cls = '';
  if (v === 'c2') {
    h += amb() + lo + art(420, 'linear-gradient(#000 40%, rgba(0,0,0,.7) 58%, rgba(0,0,0,.3) 78%, transparent)');
    h += `<div class="scr" style="top:520px;height:241px;background:linear-gradient(rgba(var(--g),0), rgba(var(--g),.42) 40%, rgba(var(--g),.5))"></div>`;
  } else if (v === 'c3') {
    top = false;
    h += amb('top:-40px;height:841px;filter:blur(40px) saturate(2) brightness(1.15)');
    h += art(340, 'linear-gradient(transparent, #000 9%, #000 52%, rgba(0,0,0,.45) 78%, transparent)');
    h += `<div class="scr" style="top:0;height:204px;background:linear-gradient(rgba(var(--g),.42), rgba(var(--g),.3) 154px, rgba(var(--g),0))"></div>`;
    h += `<div class="scr" style="top:490px;height:271px;background:linear-gradient(rgba(var(--g),0), rgba(var(--g),.42) 34%, rgba(var(--g),.5))"></div>`;
  } else if (v === 'c4') {
    cls = ' c4';
    h += amb('filter:blur(36px) saturate(1.5) brightness(.72)');
    h += `<img class="art" src="${BD}" style="top:172px;height:219px;box-shadow:0 12px 40px rgba(0,0,0,.45)">`;
    h += `<div class="scr" style="top:500px;height:261px;background:linear-gradient(rgba(var(--g),0), rgba(var(--g),.45) 40%, rgba(var(--g),.55))"></div>`;
  } else {
    h += amb() + lo + art(340, m1);
  }
  if (v === 'l1') cls = ' l1';
  if (top) h += `<div class="hdr"></div><div class="scr hfade"></div>`;
  h += `<div class="island"></div><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><span class="bat"></span></span></div>`;
  h += `<div class="topbar"><img src="${img('fan.svg')}" alt=""><span class="wm">Montage</span><span class="ib">${I('bell')}</span><span class="circ">${I('menu')}</span></div>`;
  h += `<div class="tags${top ? '' : ' br'}"><span class="on">For you</span><span>New releases</span><span>Friends enjoyed</span></div>`;
  if (v === 'l2') h += `<div class="sl pillv">${line}</div>`;
  h += `<div class="blk"><div class="prow"><img class="inset" src="${PO}"><div class="trl">${I('play')}Trailer</div><div class="snd">${I('send')}</div></div>`
    + `<div class="head"><h2>Short Term 12</h2><div class="ms"><div class="n">80<small>%</small></div><span class="l">MATCH</span></div>`
    + `<div class="m"><span>2013 · 1h 36m · Destin Daniel Cretton</span><img class="lg" src="${LG}" alt="Prime Video"></div>`
    + `<div class="fr"><span>@jakelorimer <b>3.0★</b></span></div>`
    + `<div class="w">Because you loved <a>12 Years a Slave</a></div></div></div>`;
  if (v === 'l1') h += `<div class="sl linev">${line}</div>`;
  h += `<div class="stub"><div class="p">${I('eye')}Seen it</div><div class="pf"></div><div class="p">${I('bm')}Watchlist</div><div class="pf"></div><div class="p">${I('x')}Not for me</div></div>`;
  h += `<div class="tbar"><div class="on">${I('clap')}Picks</div><div>${I('search')}Browse</div><div><span class="pill">${I('popcorn')}</span></div><div>${I('users')}Social</div><div>${I('drama')}Profile</div></div><div class="homeb"></div>`;
  return `<div class="ph fix${cls}" id="ph-${v}">${h}</div>`;
}
const col = (cap, sub, v) => `<div class="col"><div class="cap">${cap}</div><div class="capsub">${sub}</div>${phone(v)}</div>`;
document.getElementById('s1').innerHTML =
  col('C1 · 1.5x zoom', 'As mocked before: the sharp still at <b>390 x 340</b> on the subject, over a blurred, darkened copy of itself.', 'c1')
  + col('C2 · 1.9x zoom', 'A taller sharp still, <b>390 x 420</b>. The poster overlaps its foot and the fade into the blur is longer and softer.', 'c2');
document.getElementById('s2').innerHTML =
  col('C3 · 1.5x zoom', 'Still as C1, but the blur is <b>brighter, more saturated</b> and runs up behind the header and tabs. Dark only behind text.', 'c3')
  + col('C4 · 1.0x, no crop', 'The <b>whole 16:9 frame</b>, sharp, on a full-card blurred copy. Poster and text sit below it.', 'c4');
document.getElementById('s3').innerHTML =
  col('L1 · line above actions', 'C1 with a quiet status line just above the action bar. <b>Undo</b> on the right.', 'l1')
  + col('L2 · pill on the still', 'The same line as a pill over the top of the still, under the tabs.', 'l2');
// The logo rule: 8 after the director on the meta line; if that would wrap, it moves to the friend line's right end.
function placeLogos() {
  document.querySelectorAll('.fix .head').forEach((hd) => {
    const m = hd.querySelector('.m'), lg = m.querySelector('.lg');
    if (lg && m.querySelector('span').offsetWidth + 8 + 24 > m.clientWidth) hd.querySelector('.fr').appendChild(lg);
  });
}
Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => document.fonts.ready).then(() => { placeLogos(); document.body.dataset.ready = '1'; });
</script>
</body></html>
