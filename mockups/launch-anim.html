<script>
const $=id=>document.getElementById(id);
const cl=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
const spring=x=>x<=0?0:x>=1?1:1-Math.exp(-6*x)*Math.cos(9*x)*(1-x);
const ease=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
// fan: 170px box; centre start (180,300) -> header (36,74) at 44px
const F0={x:95,y:215,s:1}, F1={x:16,y:52,s:44/170};
// word: 200px wide start centred at y 420 -> header 116px wide at (64,62)
const W0={x:80,y:405,s:1}, W1={x:62,y:63,s:150/200};
window.render=function(t){
 const rise=ease(cl(t,0,300)), fan=spring(cl(t,250,900));
 const y=(1-rise)*30;
 $('L').setAttribute('transform',`translate(${-0.6*fan},${y}) rotate(${-34*fan})`);
 $('R').setAttribute('transform',`translate(${0.6*fan},${y}) rotate(${34*fan})`);
 $('C').setAttribute('transform',`translate(0,${y-3*fan})`);
 $('fan').style.opacity=rise;
 const w=ease(cl(t,650,1100));
 const k=io(cl(t,1350,1850));
 $('fan').style.transform=`translate(${lerp(F0.x,F1.x,k)}px,${lerp(F0.y,F1.y,k)}px) scale(${lerp(F0.s,F1.s,k)})`;
 $('word').style.opacity=w;
 $('word').style.transform=`translate(${lerp(W0.x,W1.x,k)}px,${lerp(W0.y+(1-w)*10,W1.y,k)}px) scale(${lerp(W0.s,W1.s,k)})`;
 $('app').style.opacity=ease(cl(t,1800,2150));
};
render(0);
</script></body></html>
